    });
  }

  /* Grouped for reading, rather than the sheet's column order. */
  const DETAIL_GROUPS = [
    { title: 'Contact', icon: 'fa-user', fields: [
      ['firstName', 'First name'], ['lastName', 'Last name'], ['email', 'Email'],
      ['jobTitle', 'Job title'], ['department', 'Department'],
      ['phoneNumber', 'Phone'], ['linkedinPersonUrl', 'LinkedIn'],
    ] },
    { title: 'Company', icon: 'fa-building', fields: [
      ['companyName', 'Company'], ['companyWebsite', 'Website'],
      ['industry', 'Industry'], ['linkedinCompanyUrl', 'Company LinkedIn'],
    ] },
    { title: 'Location', icon: 'fa-location-dot', fields: [
      ['addressLine', 'Address'], ['city', 'City'], ['state', 'State'],
      ['country', 'Country'], ['countryCode', 'Country code'],
    ] },
    { title: 'Custom fields', icon: 'fa-code', fields: [
      ['customVar1', 'Custom 1'], ['customVar2', 'Custom 2'], ['customVar3', 'Custom 3'],
      ['customVar4', 'Custom 4'], ['customVar5', 'Custom 5'],
    ] },
  ];

  /** Read-only detail panel for one lead. */
  function leadDetail(lead, opts = {}) {
    if (!lead) return;
    const senderEmails = opts.senderEmails || {};
    const owner = String(lead.ownerSender || '').trim();

    const value = (key) => {
      const raw = lead[key];
      if (raw === undefined || String(raw).trim() === '') return null;
      if (key === 'linkedinPersonUrl' || key === 'linkedinCompanyUrl' || key === 'companyWebsite') {
        const href = String(raw).startsWith('http') ? String(raw) : 'https://' + String(raw);
        return `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(raw)}</a>`;
      }
      return esc(raw);
    };

    modal({
      title: lead.email || lead.leadId || 'Lead',
      size: 'large',
      render: (body) => {
        // Only groups with at least one value are shown, so a sparse lead does
        // not open onto four blocks of dashes.
        const groups = DETAIL_GROUPS.map((g) => {
          const rows = g.fields
            .map(([k, label]) => [label, value(k)])
            .filter(([, v]) => v !== null);
          if (!rows.length) return '';
          return `
            <div class="card mt-16">
              <div class="card-head"><h3><i class="fa-solid ${g.icon}"></i> ${esc(g.title)}</h3></div>
              <div class="card-body">
                <div class="kv-list">
                  ${rows.map(([label, v]) =>
                    `<div class="kv-row"><span>${esc(label)}</span><strong>${v}</strong></div>`).join('')}
                </div>
              </div>
            </div>`;
        }).join('');

        body.innerHTML = `
          <div class="card">
            <div class="card-head">
              <h3><i class="fa-solid fa-paper-plane"></i> Sending status</h3>
              ${leadStatusBadge(lead)}
            </div>
            <div class="card-body">
              <div class="kv-list">
                <div class="kv-row"><span>Lead ID</span><strong class="mono">${esc(lead.leadId) || '—'}</strong></div>
                <div class="kv-row"><span>Campaign</span><strong class="mono">${esc(lead.campaignId) || '—'}</strong></div>
                <div class="kv-row"><span>Sequence step</span><strong>${num(lead.sequenceStep)}</strong></div>
                <div class="kv-row"><span>Status</span><strong>${esc(lead.status) || '—'}</strong></div>
                <div class="kv-row"><span>Reply</span>
                  <strong style="color:${lead.replyStatus ? 'var(--green)' : 'inherit'}">
                    ${esc(lead.replyStatus) || 'no reply yet'}</strong></div>
                <div class="kv-row"><span>Bounce</span>
                  <strong style="color:${lead.bounceStatus ? 'var(--red)' : 'inherit'}">
                    ${esc(lead.bounceStatus) || 'none'}</strong></div>
                <div class="kv-row"><span>Last sent</span><strong>${fmtDate(lead.lastSentDate)}</strong></div>
                <div class="kv-row"><span>Next send</span><strong>${fmtDate(lead.nextSentDate)}</strong></div>
                <div class="kv-row"><span>Sender</span><strong>${
                  owner ? esc(senderEmails[owner] || owner) : '—'}</strong></div>
              </div>
            </div>
          </div>
          ${groups}
          ${!groups ? `
            <div class="alert alert-warn mt-16">
              <i class="fa-solid fa-triangle-exclamation"></i>
              <div>No contact or company details came back for this lead. If the sheet
                   has them, apply Patch 11 so getLeads returns every column.</div>
            </div>` : ''}`;
      },
    });
  }

  /** masterLeads columns a CSV upload can fill. */
  const LEAD_FIELDS = [
    'email', 'firstName', 'lastName', 'companyName', 'companyWebsite',
    'jobTitle', 'department', 'industry', 'phoneNumber',
    'addressLine', 'city', 'state', 'country', 'countryCode',
    'linkedinPersonUrl', 'linkedinCompanyUrl',
    'customVar1', 'customVar2', 'customVar3', 'customVar4', 'customVar5',
  ];

  /**
   * Deliberately permissive: it rejects what is definitely not an address
   * (no @, no dot after it, spaces) without bouncing unusual but valid ones.
   * A false reject silently loses a real lead, which is worse than passing a
   * junk row the backend will drop anyway.
   */
  const looksLikeEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v || '').trim());

  return {
    esc, num, pct, initials, domainOf, fmtDate, to12h, toTimeValue,
    withSpinner, toast, toastError, modal, confirm, drawer,
    statCard, loading, skeletonRows, skeletonCards, empty, errorBox, pager,
    LEAD_COLUMNS, leadTable, wireLeadTable, leadDetail,
    leadStatusBadge, campaignStatusBadge, tagColor, setTagColors, TAG_PALETTE, debounce,
    TIMEZONES, DAYS, LEAD_FIELDS, looksLikeEmail,
  };
})();

/* ==========================================================================
   charts.js — Chart.js wrappers with the Reach X dark theme baked in.
   Every chart is destroyed before re-render so switching tabs doesn't leak
   canvases or leave stale tooltips behind.
   ========================================================================== */

const Charts = (() => {

  const COLORS = {
    accent: '#4f8ef7',
    green:  '#22c55e',
    red:    '#ef4444',
    orange: '#f59e0b',
    purple: '#a78bfa',
    grid:   '#252936',
    text:   '#9ba6b9',
  };

  /**
   * '2026-08-02' → 'Aug 2'.
   *
   * The dailySummary date column comes back as a stringified Date when the
   * cell is date-typed, e.g. "Sat May 16 2026 00:00:00 GMT+0300 (Eastern
   * European Summer Time)" — so a plain ISO match is not enough.
   */
  function shortDate(v) {
    const s = String(v ?? '').trim();
    if (!s) return '';

    const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (iso) {
      const d = new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]));
      return isNaN(d.getTime()) ? s
        : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    // "Sat May 16 2026 …" — read the parts out of the string rather than
    // through Date parsing, which would re-apply the viewer's offset.
    const named = s.match(/\b([A-Z][a-z]{2})\s+(\d{1,2})\s+(\d{4})\b/);
    if (named) return `${named[1]} ${Number(named[2])}`;

    const parsed = new Date(s);
    if (!isNaN(parsed.getTime())) {
      return parsed.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }
    return s.length > 12 ? s.slice(0, 12) + '…' : s;
  }

  const registry = new Map();

  function destroy(canvasId) {
    const chart = registry.get(canvasId);
    if (chart) {
      chart.destroy();
      registry.delete(canvasId);
    }
  }

  function destroyAll() {
    for (const chart of registry.values()) chart.destroy();
    registry.clear();
  }

  const baseOptions = (extra = {}) => ({
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: {
        display: true,
        position: 'top',
        align: 'end',
        labels: {
          color: COLORS.text,
          boxWidth: 9,
          boxHeight: 9,
          usePointStyle: true,
          pointStyle: 'circle',
          font: { size: 11.5 },
        },
      },
      tooltip: {
        backgroundColor: '#1a1d27',
        borderColor: '#2a2d3a',
        borderWidth: 1,
        titleColor: '#fff',
        bodyColor: '#c9d1de',
        padding: 10,
        cornerRadius: 8,
        displayColors: true,
        boxWidth: 8,
        boxHeight: 8,
        usePointStyle: true,
        callbacks: {
          // Tooltips keep the full date even though the axis is abbreviated.
          title: (items) => shortDate(items[0]?.label) || items[0]?.label || '',
        },
      },
    },
    scales: {
      x: {
        grid: { color: COLORS.grid, drawBorder: false },
        ticks: {
          color: COLORS.text,
          font: { size: 11 },
          maxRotation: 0,
          autoSkip: true,
          autoSkipPadding: 18,
          // Thins the axis to roughly 8 labels so dates never collide.
          callback(value, index, all) {
            const every = Math.max(1, Math.ceil(all.length / 8));
            if (index % every !== 0 && index !== all.length - 1) return '';
            return shortDate(this.getLabelForValue(value));
          },
        },
      },
      y: {
        beginAtZero: true,
        grid: { color: COLORS.grid, drawBorder: false },
        ticks: { color: COLORS.text, font: { size: 11 }, precision: 0 },
      },
    },
    ...extra,
  });

  function mount(canvasId, config) {
    const el = document.getElementById(canvasId);
    if (!el) return null;
    destroy(canvasId);
    const chart = new Chart(el.getContext('2d'), config);
    registry.set(canvasId, chart);
    return chart;
  }

  /**
   * Line chart.
   *
   * Pass `yAxisID: 'y2'` on a dataset to put it on a right-hand axis. Reply and
   * bounce counts run 0-5 against send volumes in the hundreds; on one shared
   * axis they sit flat against zero and read as "no replies at all", which is
   * actively misleading.
   */
  function line(canvasId, labels, datasets) {
    const opts = baseOptions();

    if (datasets.some((d) => d.yAxisID === 'y2')) {
      opts.scales.y2 = {
        position: 'right',
        beginAtZero: true,
        grid: { drawOnChartArea: false },
        ticks: { color: COLORS.text, font: { size: 11 }, precision: 0 },
      };
    }

    return mount(canvasId, {
      type: 'line',
      data: {
        labels,
        datasets: datasets.map((d) => ({
          tension: 0.35,
          borderWidth: 2,
          pointRadius: labels.length > 40 ? 0 : 3,
          pointHoverRadius: 5,
          fill: d.fill ?? false,
          ...d,
        })),
      },
      options: opts,
    });
  }

  /** Bar chart. Pass stacked:true for the New Lead vs Follow-up split. */
  function bar(canvasId, labels, datasets, { stacked = false } = {}) {
    const opts = baseOptions();
    if (stacked) {
      opts.scales.x.stacked = true;
      opts.scales.y.stacked = true;
    }
    return mount(canvasId, {
      type: 'bar',
      data: {
        labels,
        datasets: datasets.map((d) => ({
          borderRadius: 4,
          borderSkipped: false,
          maxBarThickness: 26,
          ...d,
        })),
      },
      options: opts,
    });
  }

  /** Translucent fill under a line series. */
  function fade(ctx, hex) {
    const g = ctx.createLinearGradient(0, 0, 0, 240);
    g.addColorStop(0, hex + '55');
    g.addColorStop(1, hex + '00');
    return g;
  }

  return { COLORS, line, bar, fade, destroy, destroyAll, shortDate };
})();

/* ==========================================================================
   dashboard.js — TAB 1
   All-time totals come from senderAccounts (getSenders).
   The date-filtered numbers come from dailySummary, which is the only
   time-series the backend keeps.
   ========================================================================== */

const Dashboard = (() => {

  let state = { senders: [], summary: [], campaigns: [], status: null, days: 30 };

  async function render(view) {
    view.innerHTML = UI.skeletonCards(4) + `<div class="card mt-16">${UI.skeletonRows(4, 4)}</div>`;

    try {
      // dailySummary is fetched at its widest useful range once, then sliced
      // client-side so changing the range doesn't re-hit the backend.
      const [senders, summary, campaigns] = await Promise.all([
        API.getSenders(),
        API.getDailySummary(90),
        API.getCampaigns().catch(() => []),
      ]);
      state.senders = senders;
      state.summary = summary;
      state.campaigns = campaigns;
    } catch (err) {
      view.innerHTML = UI.errorBox(err.message);
      return;
    }

    paint(view);
  }

  function totals() {
    const s = state.senders;
    const sum = (key) => s.reduce((acc, x) => acc + (Number(x[key]) || 0), 0);

    // Leads contacted is a property of the LEADS, not of the senders: one lead
    // handled by two senders was counted twice in the senderAccounts column.
    // contactedCount is the per-campaign count of leads at sequenceStep >= 1,
    // written by the sync. Fall back to the sender column until patch N2 lands.
    const campContacted = (state.campaigns || [])
      .reduce((a, c) => a + (Number(c.contactedCount) || 0), 0);
    const haveCampCount = (state.campaigns || [])
      .some((c) => c.contactedCount !== undefined);

    return {
      totalSent:       sum('totalSentCount'),
      contacted:       haveCampCount ? campContacted : sum('totalLeadsContacted'),
      replies:         sum('repliesReceived'),
      bounces:         sum('bouncedEmails'),
      sentToday:       sum('sentToday'),
      capacity:        sum('dailyLimit'),
      active:          s.filter((x) => x.isActive === 'Active').length,
      total:           s.length,
    };
  }

  /** Slice of dailySummary for the currently selected range. */
  function windowed() {
    return state.summary.slice(-state.days);
  }

  function paint(view) {
    const t = totals();
    const win = windowed();
    const winSent = win.reduce((a, r) => a + (r.emailsSent || 0), 0);

    view.innerHTML = `
      <div class="section-head">
        <h1>Dashboard</h1>
        <div class="row row-end">
          <select id="dashRange" style="width:auto">
            <option value="7"${state.days === 7 ? ' selected' : ''}>Last 7 days</option>
            <option value="30"${state.days === 30 ? ' selected' : ''}>Last 30 days</option>
            <option value="90"${state.days === 90 ? ' selected' : ''}>Last 90 days</option>
          </select>
        </div>
      </div>

      <div class="grid grid-4">
        ${UI.statCard({
          label: 'Total Emails Sent', icon: 'fa-paper-plane', tone: '',
          value: UI.num(t.totalSent),
          sub: `${UI.num(winSent)} in range`,
          hint: 'All-time total from every sender account. The smaller number is the selected date range.',
        })}
        ${UI.statCard({
          label: 'Total Leads Contacted', icon: 'fa-user-check', tone: 'purple',
          value: UI.num(t.contacted),
          hint: 'Unique leads that received at least one email. Used as the denominator for reply and bounce rate.',
        })}
        ${UI.statCard({
          label: 'Reply Rate', icon: 'fa-reply', tone: 'green',
          value: UI.pct(t.replies, t.contacted),
          sub: UI.num(t.replies),
          hint: 'Replies divided by leads contacted — not by emails sent, since follow-ups inflate that.',
        })}
        ${UI.statCard({
          label: 'Bounce Rate', icon: 'fa-triangle-exclamation', tone: 'red',
          value: UI.pct(t.bounces, t.contacted),
          sub: UI.num(t.bounces),
          hint: 'Bounces divided by leads contacted.',
        })}
      </div>

      <div class="grid grid-split mt-16">
        <div class="card">
          <div class="card-head">
            <h3>Emails sent</h3>
            <span class="small muted">${win.length} day${win.length === 1 ? '' : 's'} of history</span>
          </div>
          <div class="card-body">
            ${win.length
              ? `<div class="chart-box"><canvas id="dashChart"></canvas></div>`
              : UI.empty({ icon: 'fa-chart-line', title: 'No history yet',
                           text: 'The dailySummary sheet fills in after the first nightly reset runs.' })}
          </div>
        </div>

        <div class="card">
          <div class="card-head"><h3>System status</h3>
            <button class="btn btn-ghost btn-sm" id="liveStatusBtn">
              <span class="btn-label"><i class="fa-solid fa-satellite-dish"></i> Live check</span>
            </button>
          </div>
          <div class="card-body">
            <div class="kv-list">
              <div class="kv-row"><span>Active senders</span>
                <strong>${UI.num(t.active)} / ${UI.num(t.total)}</strong></div>
              <div class="kv-row"><span>Sent today</span>
                <strong>${UI.num(t.sentToday)}</strong></div>
              <div class="kv-row"><span>Daily capacity</span>
                <strong>${UI.num(t.capacity)}</strong></div>
              <div class="kv-row"><span>Capacity used</span>
                <strong>${UI.pct(t.sentToday, t.capacity)}</strong></div>
            </div>
            <div class="progress mt-16" style="width:100%">
              <span style="width:${Math.min(100, t.capacity ? (t.sentToday / t.capacity) * 100 : 0)}%"></span>
            </div>
            <div id="liveStatusOut" class="mt-16"></div>
          </div>
        </div>
      </div>

      <div class="card mt-16">
        <div class="card-head">
          <h3>Quick actions</h3>
          <span class="small muted">Distribution runs are queued and start within about a minute</span>
        </div>
        <div class="card-body">
          <div class="row">
            <button class="btn btn-primary" data-op="distributeCold"
                    data-label="Run cold distribution">
              <span class="btn-label"><i class="fa-solid fa-play"></i> Run Distribution</span></button>
            <button class="btn" data-op="kickoffAllSenders" data-label="Kickoff all senders">
              <span class="btn-label"><i class="fa-solid fa-bolt"></i> Kickoff All Senders</span></button>
            <button class="btn" data-op="kickoffAllFollowups" data-label="Kickoff all follow-ups">
              <span class="btn-label"><i class="fa-solid fa-reply-all"></i> Kickoff Follow-ups</span></button>
            <button class="btn" data-op="cleanupAllTriggers" data-label="Clean up triggers"
                    data-confirm="Delete orphaned triggers on every sender and reset stuck rows?">
              <span class="btn-label"><i class="fa-solid fa-broom"></i> Cleanup Triggers</span></button>
            <button class="btn btn-ghost" data-op="resumeAll" data-label="Resume all senders"
                    data-confirm="This sets EVERY sender to Active — including any you paused deliberately for warmup or deliverability. There is no undo. Continue?">
              <span class="btn-label"><i class="fa-solid fa-circle-play"></i> Resume All</span></button>
            <button class="btn btn-danger" data-op="emergencyStop" data-label="Emergency stop"
                    data-confirm="This pauses EVERY sender immediately. Sending stops until you resume. Continue?">
              <span class="btn-label"><i class="fa-solid fa-hand"></i> Emergency Stop</span></button>
          </div>
        </div>
      </div>`;

    if (win.length) drawChart(win);
    wire(view);
  }

  function drawChart(win) {
    const ctx = document.getElementById('dashChart').getContext('2d');
    Charts.line('dashChart', win.map((r) => r.date), [
      {
        label: 'Emails sent',
        data: win.map((r) => r.emailsSent || 0),
        borderColor: Charts.COLORS.accent,
        backgroundColor: Charts.fade(ctx, Charts.COLORS.accent),
        fill: true,
      },
      // Right-hand axis: single-digit counts would otherwise sit flat on zero
      // next to send volumes in the hundreds and look like no activity at all.
      {
        label: 'Replies',
        data: win.map((r) => r.repliesReceived || 0),
        borderColor: Charts.COLORS.green,
        backgroundColor: 'transparent',
        yAxisID: 'y2',
      },
      {
        label: 'Bounces',
        data: win.map((r) => r.bouncedEmails || 0),
        borderColor: Charts.COLORS.red,
        backgroundColor: 'transparent',
        yAxisID: 'y2',
      },
    ]);
  }


  function wire(view) {
    view.querySelector('#dashRange').onchange = (e) => {
      state.days = parseInt(e.target.value, 10);
      paint(view);
    };

    // Live status is a separate opt-in click: it POSTs to every sender and can
    // take a minute at full scale, so it must not run on page load.
    view.querySelector('#liveStatusBtn').onclick = (e) => {
      const btn = e.currentTarget;
      const out = view.querySelector('#liveStatusOut');
      UI.withSpinner(btn, async () => {
        out.innerHTML = '';
        try {
          const s = await API.getSystemStatus();
          out.innerHTML = `
            <div class="divider"></div>
            <div class="kv-list">
              <div class="kv-row"><span>Reported sent today</span><strong>${UI.num(s.totalSentToday)}</strong></div>
              <div class="kv-row"><span>Cold queued</span><strong>${UI.num(s.totalColdQueued)}</strong></div>
              <div class="kv-row"><span>Follow-ups queued</span><strong>${UI.num(s.totalFollowQueued)}</strong></div>
              <div class="kv-row"><span>Active triggers</span><strong>${UI.num(s.activeTriggers)}</strong></div>
              <div class="kv-row"><span>Errors</span>
                <strong style="color:${s.totalErrors > 0 ? 'var(--red)' : 'inherit'}">${UI.num(s.totalErrors)}</strong></div>
              <div class="kv-row"><span>Senders reached</span>
                <strong>${UI.num(s.senders?.length || 0)} / ${UI.num(s.senderCount)}</strong></div>
            </div>
            ${(s.senders?.length || 0) < (s.senderCount || 0)
              ? `<div class="alert alert-warn mt-16"><i class="fa-solid fa-triangle-exclamation"></i>
                 <div>${UI.num(s.senderCount - s.senders.length)} sender(s) did not respond. Run Validate System in Settings to see which.</div></div>`
              : ''}`;
        } catch (err) {
          out.innerHTML = UI.errorBox(err.message);
        }
      });
    };

    view.querySelectorAll('[data-op]').forEach((btn) => {
      btn.onclick = async () => {
        const action  = btn.dataset.op;
        const label   = btn.dataset.label;
        const confirm = btn.dataset.confirm;

        if (confirm && !(await UI.confirm({
          title: label, message: confirm, confirmLabel: label,
        }))) return;

        UI.withSpinner(btn, async () => {
          try {
            const res = await API.op(action);
            UI.toast(res.message || describe(action, res), 'success');
          } catch (err) {
            UI.toastError(err);
          }
        });
      };
    });
  }

  /** Ops endpoints return varied shapes; turn each into one readable line. */
  function describe(action, res) {
    if (typeof res.paused === 'number')    return `Paused ${res.paused} sender(s).`;
    if (typeof res.resumed === 'number')   return `Resumed ${res.resumed} sender(s).`;
    if (typeof res.succeeded === 'number') return `Done — ${res.succeeded} succeeded, ${res.failed} failed.`;
    return 'Done.';
  }

  return { render };
})();

/* ==========================================================================
   accounts.js — TAB 2 (Email Accounts)

   Backend reality check, so the UI never invents numbers:
     • getSenders() does NOT return tags. Tags are stitched in from
       getAllTags() + getSendersByTag() and cached.
     • There is no warmup score, no SPF/DKIM/DMARC/MX checking and no open
       tracking anywhere in this backend, so those columns are not rendered.
     • There is no per-sender time series — dailySummary is system-wide only.
       The per-account drawer therefore shows lifetime totals, not a daily chart.
   ========================================================================== */

const Accounts = (() => {

  let state = {
    senders: [], tagMap: {}, tags: [],
    search: '', status: 'all', tag: 'all',
    page: 1, pageSize: 50,
    selected: new Set(),
  };

  /* ── data ─────────────────────────────────────────────────────────────── */

  async function load() {
    state.senders = await API.getSenders();
  }

  /**
   * Tags cost one request per tag, because getSenders omits tagName entirely.
   * That is the single most expensive thing this screen can do, so it runs
   * after the table is already on screen and never blocks it. Results are
   * cached by the API layer, so revisiting the tab costs nothing.
   */
  async function loadTags(view) {
    if (state.tagsLoaded) return;
    try {
      state.tags = await API.getAllTags();
      UI.setTagColors(state.tags);

      // Patch 4 makes getSenders return tagName, which removes the whole N+1
      // below. Use it when present and fall back to per-tag lookups otherwise.
      const inline = state.senders.some((s) => s.tagName !== undefined);
      const map = {};

      if (inline) {
        state.senders.forEach((s) => {
          const names = String(s.tagName || '').split(',')
            .map((x) => x.trim()).filter(Boolean);
          if (names.length) map[s.emailID] = names;
        });
      } else {
        const lists = await Promise.all(state.tags.map((t) => API.getSendersByTag(t.tagName)));
        state.tags.forEach((t, i) => {
          lists[i].forEach((s) => { (map[s.emailID] ||= []).push(t.tagName); });
        });
      }

      state.tagMap = map;
      state.tagsLoaded = true;
      if (view && view.isConnected) paint(view);
    } catch {
      state.tags = [];
      state.tagMap = {};                 // tags are decorative — never block the table
      state.tagsLoaded = true;
    }
  }

  function filtered() {
    const q = state.search.trim().toLowerCase();
    return state.senders.filter((s) => {
      if (state.status === 'active' && s.isActive !== 'Active') return false;
      if (state.status === 'paused' && s.isActive === 'Active') return false;
      if (state.status === 'atlimit' && !(s.sentToday >= s.dailyLimit)) return false;
      if (state.tag !== 'all' && !(state.tagMap[s.emailID] || []).includes(state.tag)) return false;
      if (!q) return true;
      return [s.emailAddress, s.emailID, s.emailFirstName, s.emailLastName]
        .some((v) => String(v || '').toLowerCase().includes(q));
    });
  }

  function totals(list) {
    const sum = (k) => list.reduce((a, x) => a + (Number(x[k]) || 0), 0);
    return {
      accounts:  list.length,
      domains:   new Set(list.map((s) => UI.domainOf(s.emailAddress)).filter(Boolean)).size,
      active:    list.filter((s) => s.isActive === 'Active').length,
      paused:    list.filter((s) => s.isActive !== 'Active').length,
      atLimit:   list.filter((s) => s.dailyLimit > 0 && s.sentToday >= s.dailyLimit).length,
      sent:      sum('totalSentCount'),
      contacted: sum('totalLeadsContacted'),
      replies:   sum('repliesReceived'),
      bounces:   sum('bouncedEmails'),
      sentToday: sum('sentToday'),
      capacity:  sum('dailyLimit'),
    };
  }

      return;

    state.page = 1;
    state.selected.clear();
    paint(view);

    // Re-sync tags on entry. The API layer caches these, so returning to the
    // tab within the TTL costs nothing; after a write it picks up the change.
    state.tagsLoaded = false;
    loadTags(view);                       // fills the Tags column once it lands
  }

  /* ── events ───────────────────────────────────────────────────────────── */

  function wire(view) {
    const repaint = () => paint(view);

    view.querySelector('#acctSearch').oninput = UI.debounce((e) => {
      state.search = e.target.value;
      state.page = 1;
      repaint();
      // Keep focus and caret where the user left them after the re-render.
      const box = view.querySelector('#acctSearch');
      box.focus();
      box.setSelectionRange(box.value.length, box.value.length);
    }, 300);

    view.querySelector('#acctStatus').onchange   = (e) => { state.status = e.target.value; state.page = 1; repaint(); };
    view.querySelector('#acctTagFilter').onchange = (e) => { state.tag = e.target.value; state.page = 1; repaint(); };
    view.querySelector('#acctPageSize').onchange = (e) => { state.pageSize = +e.target.value; state.page = 1; repaint(); };

    view.querySelector('#detailedBtn').onclick = () => detailedAnalytics();

    view.querySelector('[data-page-prev]')?.addEventListener('click', () => { state.page--; repaint(); });
    view.querySelector('[data-page-next]')?.addEventListener('click', () => { state.page++; repaint(); });

    const selAll = view.querySelector('#selAll');
    if (selAll) {
      const visible = filtered();
      selAll.checked = visible.length > 0 && visible.every((s) => state.selected.has(s.emailID));
      selAll.onchange = (e) => {
        visible.forEach((s) =>
          e.target.checked ? state.selected.add(s.emailID) : state.selected.delete(s.emailID));
        repaint();
      };
    }

    view.querySelectorAll('.rowSel').forEach((cb) => {
      cb.onchange = (e) => {
        e.target.checked ? state.selected.add(cb.dataset.id) : state.selected.delete(cb.dataset.id);
        repaint();
      };
    });

    view.querySelector('#bulkBtn')?.addEventListener('click', () => bulkActions(view));

    view.querySelectorAll('[data-view]').forEach((b) => {
      b.onclick = () => openDrawer(b.dataset.view, view, 'analytics');
    });
    view.querySelectorAll('[data-edit]').forEach((b) => {
      b.onclick = () => openDrawer(b.dataset.edit, view, 'settings');
    });

    view.querySelectorAll('[data-restart]').forEach((b) => {
      b.onclick = (e) => {
        const id = b.dataset.restart;
        UI.withSpinner(e.currentTarget, async () => {
          try {
            const res = await API.restartSenderChain(id);
            UI.toast(
              res.restarted
                ? `${id}: send chain restarted`
                : `${id}: restart sent, but the sender did not confirm both chains`,
              res.restarted ? 'success' : 'warn',
            );
          } catch (err) { UI.toastError(err); }
        });
      };
    });

    view.querySelector('#healthBtn').onclick = (e) => healthCheck(e.currentTarget, view);
  }

  /* ── chain health check ───────────────────────────────────────────────── */

  /**
   * Asks every sender whether its chain is actually running.
   *
   * A sender with Queued rows but no processSingleSend trigger has had its
   * chain die — nothing restarts it on its own, and it silently sends nothing
   * all day. This finds those and restarts them.
   */
  function healthCheck(btn, view) {
    UI.withSpinner(btn, async () => {
      let res;
      try {
        res = await API.checkSenderChains({ autoFix: true });
      } catch (err) {
        return UI.toastError(err);
      }

      UI.modal({
        title: 'Sender health check', size: 'large',
        render: (body) => {
          const rows = res.senders || [];
          const problem = rows.filter((r) => r.state === 'stalled');
          const unreachable = rows.filter(
            (r) => r.state === 'unreachable' || r.state === 'unreadable');

          body.innerHTML = `
            <div class="grid grid-4">
              ${UI.statCard({ label: 'Checked', value: UI.num(res.checked), icon: 'fa-list-check' })}
              ${UI.statCard({ label: 'Healthy', value: UI.num(res.healthy), icon: 'fa-circle-check', tone: 'green' })}
              ${UI.statCard({ label: 'Stalled', value: UI.num(res.stalled), icon: 'fa-triangle-exclamation',
                              tone: res.stalled ? 'orange' : '' })}
              ${UI.statCard({ label: 'Unreachable', value: UI.num(res.unreachable), icon: 'fa-plug-circle-xmark',
                              tone: res.unreachable ? 'red' : '' })}
            </div>

            ${res.restarted ? `
              <div class="alert alert-ok mt-16">
                <i class="fa-solid fa-circle-check"></i>
                <div>Restarted ${UI.num(res.restarted)} chain(s). They begin sending within
                     a few minutes — press Health check again shortly to confirm.</div>
              </div>` : ''}

            ${!res.stalled && !res.unreachable ? `
              <div class="alert alert-ok mt-16">
                <i class="fa-solid fa-circle-check"></i>
                <div>Every sender is either running or has nothing queued.</div>
              </div>` : ''}

            ${problem.length ? `
              <div class="card mt-16">
                <div class="card-head"><h3>Was stalled</h3></div>
                <div class="table-wrap">
                  <table class="tbl">
                    <thead><tr><th>Sender</th><th>Cold queued</th><th>Follow-ups queued</th>
                               <th>Today</th></tr></thead>
                    <tbody>
                      ${problem.map((r) => `
                        <tr>
                          <td class="cell-strong">${UI.esc(r.emailID)}</td>
                          <td class="num">${UI.num(r.coldQueued)}</td>
                          <td class="num">${UI.num(r.followupQueued)}</td>
                          <td class="num">${UI.num(r.sentToday)} / ${UI.num(r.dailyLimit)}</td>
                        </tr>`).join('')}
                    </tbody>
                  </table>
                </div>
              </div>` : ''}

            ${unreachable.length ? `
              <div class="card mt-16">
                <div class="card-head"><h3>Could not be reached</h3></div>
                <div class="card-body">
                  <div class="kv-list">
                    ${unreachable.map((r) => `
                      <div class="kv-row"><span>${UI.esc(r.emailID)}</span>
                        <strong style="color:var(--red)">${UI.esc(r.error || r.state)}</strong></div>`).join('')}
                  </div>
                  <div class="field-help">
                    These did not answer at all. Usually the sender's Apps Script
                    deployment was replaced without updating its webAppUrl.
                  </div>
                </div>
              </div>` : ''}`;
        },
      });

      if (res.stalled || res.unreachable) {
        UI.toast(
          `${res.stalled} stalled, ${res.unreachable} unreachable` +
          (res.restarted ? ` — ${res.restarted} restarted` : ''),
          res.unreachable ? 'warn' : 'success',
        );
      } else {
        UI.toast('All senders healthy', 'success');
      }

      render(view);
    });
  }

  /* ── per-account drawer ───────────────────────────────────────────────── */

  function openDrawer(emailID, view, initialTab = 'analytics') {
    const list = filtered();
    let idx = list.findIndex((s) => s.emailID === emailID);
    if (idx < 0) idx = 0;

    const d = UI.drawer({
      render: (el, close) => paintDrawer(el, close),
    });

    function paintDrawer(el, close) {
      const s = list[idx];
      const tags = state.tagMap[s.emailID] || [];

      el.innerHTML = `
        <div class="drawer-head">
          <div class="avatar">${UI.esc(UI.initials(s.emailAddress || s.emailID))}</div>
          <div style="min-width:0;flex:1">
            <div class="cell-strong">${UI.esc(s.emailAddress || s.emailID)}</div>
            <div class="cell-sub">
              <span class="badge ${s.isActive === 'Active' ? 'green' : 'orange'}">${UI.esc(s.isActive)}</span>
              <span style="margin-left:6px">${UI.esc(s.emailID)}</span>
            </div>
          </div>
          <button class="icon-btn" data-prev ${idx === 0 ? 'disabled' : ''} title="Previous">
            <i class="fa-solid fa-chevron-up"></i></button>
          <button class="icon-btn" data-next ${idx >= list.length - 1 ? 'disabled' : ''} title="Next">
            <i class="fa-solid fa-chevron-down"></i></button>
          <button class="icon-btn" data-close title="Close"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div style="padding:14px 20px 0">
          <div class="subtabs">
            <button data-sub="analytics" class="${initialTab === 'analytics' ? 'active' : ''}">Analytics</button>
            <button data-sub="settings"  class="${initialTab === 'settings' ? 'active' : ''}">Settings</button>
          </div>
        </div>

        <div class="drawer-body" id="drawerBody"></div>`;

      el.querySelector('[data-close]').onclick = close;
      el.querySelector('[data-prev]').onclick = () => { if (idx > 0) { idx--; paintDrawer(el, close); } };
      el.querySelector('[data-next]').onclick = () => { if (idx < list.length - 1) { idx++; paintDrawer(el, close); } };
      el.querySelectorAll('[data-sub]').forEach((b) => {
        b.onclick = () => { initialTab = b.dataset.sub; paintDrawer(el, close); };
      });

      const bodyEl = el.querySelector('#drawerBody');
      initialTab === 'settings' ? drawerSettings(bodyEl, s, view, close) : drawerAnalytics(bodyEl, s, tags);
    }

    return d;
  }

        body.innerHTML = `

                <div class="field-help">

          } else if (kind.value === 'rampNow') {
            wrap.innerHTML = `
              <div class="field">
                <label>Increase by</label>
                <input type="number" id="bulkVal" min="1" max="50" value="5">

                  Adds this to each selected account's current daily limit, right now,

                </div>

          } else if (kind.value === 'status') {
            wrap.innerHTML = `
              <div class="field">
                <label>New status</label>
                <select id="bulkVal">
                  <option value="Active">Active</option>
                  <option value="Paused">Paused</option>
                </select>
              </div>`;
          } else {
            wrap.innerHTML = `
              <div class="field">
                <label>Tag name</label>
                <input id="bulkVal" placeholder="e.g. warm">
              </div>`;
          }
        };
        paintInput();
        kind.onchange = paintInput;
      },
      footer: (foot, close) => {
        const cancel = document.createElement('button');
        cancel.className = 'btn btn-ghost';
        cancel.textContent = 'Cancel';
        cancel.onclick = close;

        const apply = document.createElement('button');
        apply.className = 'btn btn-primary';
        apply.innerHTML = '<span class="btn-label">Apply to ' + ids.length + '</span>';
        apply.onclick = () => {
          const kind = document.getElementById('bulkKind').value;
          const raw  = document.getElementById('bulkVal').value;

          UI.withSpinner(apply, async () => {
            try {
              if (kind === 'tag') {
                if (!raw.trim()) return UI.toast('Enter a tag name', 'warn');
                await API.assignTag({ senderIds: ids, tagName: raw.trim(), tagColor: UI.tagColor(raw.trim()) });
                UI.toast(`Tag "${raw.trim()}" assigned to ${ids.length} account(s)`, 'success');

              } else if (kind === 'rampNow') {
                // Raise each account from its OWN limit — a single shared value
                // would drag established accounts down to the newcomers' level.
                const step = parseInt(raw, 10) || 0;
                if (step <= 0) return UI.toast('Enter how much to increase by', 'warn');

                const settings = await API.getSettings().catch(() => ({}));
                const max = parseInt(settings.warmupMaxLimit || 0, 10) || Infinity;
                const picked = state.senders.filter((x) => ids.includes(x.emailID));

                let moved = 0, capped = 0;
                for (const snd of picked) {
                  const next = Math.min(max, (snd.dailyLimit || 0) + step);
                  if (next === snd.dailyLimit) { capped++; continue; }
                  await API.updateSenderConfig({ senderIds: [snd.emailID], fields: { dailyLimit: next } });
                  moved++;
                }
                UI.toast(
                  `Raised ${moved} account(s) by ${step}` +
                  (capped ? ` — ${capped} already at the ${max} maximum` : ''),
                  'success',
                );

              } else {
                const fields = kind === 'dailyLimit' ? { dailyLimit: parseInt(raw, 10) || 0 }
                             : kind === 'rampUp'     ? { rampUp: raw }
                             : { isActive: raw };
                const res = await API.updateSenderConfig({ senderIds: ids, fields });
                UI.toast(`Updated ${res.updated} account(s) — ${res.synced} synced, ${res.failed} failed`, 'success');
              }
              close();
              state.selected.clear();
              render(view);
            } catch (err) { UI.toastError(err); }
          });
        };

        foot.append(cancel, apply);
      },
    });
  }

  return { render };
})();

/* ==========================================================================
   campaigns.js — TAB 3

   Two backend constraints shape this whole screen:

   1. A campaign is one sheet row PER SEQUENCE STEP. createCampaign() needs the
      full steps array up front, and updateCampaign() can only edit steps that
      already exist — it cannot add or remove them. So "New campaign" asks for
      the step count immediately; changing it later means recreating.
   2. There is no per-campaign time series. getDailySummary is system-wide, so
      campaign analytics are a point-in-time snapshot from getCampaignStats.
   ========================================================================== */

const Campaigns = (() => {

  let state = { campaigns: [], statsById: {}, search: '', status: 'all' };
  let detail = null;               // { campaign, tab, stats, leads… } when open

  const SEND_PRESETS = [
    { key: '100/0', label: 'All new',       cold: 1.0, sub: '100% cold · 0% follow-up' },
    { key: '80/20', label: 'Growth',        cold: 0.8, sub: '80% cold · 20% follow-up' },
    { key: '60/40', label: 'Progress',      cold: 0.6, sub: '60% cold · 40% follow-up' },
    { key: '50/50', label: 'Balanced',      cold: 0.5, sub: '50% cold · 50% follow-up' },
    { key: '20/80', label: 'Retention',     cold: 0.2, sub: '20% cold · 80% follow-up' },
    { key: '0/100', label: 'All follow-up', cold: 0.0, sub: '0% cold · 100% follow-up' },
  ];

  /* ── CSV parsing ──────────────────────────────────────────────────────── */

  /** RFC4180-ish parser: handles quoted fields, escaped quotes and CRLF. */
  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const c = text[i];

      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
        continue;
      }

      if (c === '"')                     { inQuotes = true; }
      else if (c === ',')                { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); field = '';
        if (row.some((v) => v.trim() !== '')) rows.push(row);
        row = [];
      }
      else field += c;
    }
    row.push(field);
    if (row.some((v) => v.trim() !== '')) rows.push(row);

    if (!rows.length) return { headers: [], rows: [] };
    return { headers: rows[0].map((h) => h.trim()), rows: rows.slice(1) };
  }

  /**
   * Renders template text as it would roughly read when sent: takes the first
   * spintax option and drops the {{variable}} braces. Raw [[random|…]] blocks
   * are unreadable in a narrow preview card.
   */
  function plainPreview(text) {
    return String(text || '')
      .replace(/\[\[\s*random\s*\|(.*?)\]\]/gis, (_, opts) => opts.split('|')[0].trim())
      .replace(/\{\{\s*(.*?)\s*\}\}/g, (_, key) => key)
      .replace(/\s+/g, ' ')
      .trim();
  }

  /** Best-guess mapping of a CSV header onto a masterLeads field. */
  function guessField(header) {
    const h = header.toLowerCase().replace(/[\s_\-]/g, '');
    const table = {
      email: 'email', emailaddress: 'email', mail: 'email', workemail: 'email',
      firstname: 'firstName', fname: 'firstName', first: 'firstName', givenname: 'firstName',
      lastname: 'lastName', lname: 'lastName', last: 'lastName', surname: 'lastName',
      company: 'companyName', companyname: 'companyName', organization: 'companyName',
      account: 'companyName', accountname: 'companyName',
      website: 'companyWebsite', companywebsite: 'companyWebsite', url: 'companyWebsite',
      domain: 'companyWebsite',
      title: 'jobTitle', jobtitle: 'jobTitle', position: 'jobTitle', role: 'jobTitle',
      department: 'department', industry: 'industry',
      phone: 'phoneNumber', phonenumber: 'phoneNumber', mobile: 'phoneNumber',
      city: 'city', country: 'country', location: 'city',
    };
    return table[h] || '';
  }

  /* ── list view ────────────────────────────────────────────────────────── */

  async function render(view) {
    detail = null;
    view.innerHTML = UI.skeletonCards(5) + `<div class="card mt-16">${UI.skeletonRows(5, 6)}</div>`;
    try {
      state.campaigns = await API.getCampaigns();
    } catch (err) {
      view.innerHTML = UI.errorBox(err.message);
      return;
    }
    paintList(view);
  }

  function listFiltered() {
    const q = state.search.trim().toLowerCase();
    return state.campaigns.filter((c) => {
      if (state.status !== 'all' && String(c.campaignStatus).toLowerCase() !== state.status) return false;
      if (!q) return true;
      return (c.campaignName + ' ' + c.campaignId).toLowerCase().includes(q);
    });
  }

  function paintList(view) {
    const list = listFiltered();
    const sum = (k) => state.campaigns.reduce((a, c) => a + (Number(c[k]) || 0), 0);
    const totalLeads = sum('totalLeads');
    const contacted  = sum('sentCount');
    const replies    = sum('replyCount');
    const bounced    = sum('bouncedEmails');

    view.innerHTML = `
      <div class="section-head">
        <h1>Campaigns</h1>
        <div class="row row-end">
          <select id="campStatus" style="width:auto">
            <option value="all">Show all</option>
            <option value="active"${state.status === 'active' ? ' selected' : ''}>Active</option>
            <option value="paused"${state.status === 'paused' ? ' selected' : ''}>Paused</option>
            <option value="draft"${state.status === 'draft' ? ' selected' : ''}>Draft</option>
          </select>
          <button class="btn btn-ghost" id="syncStatsBtn" title="Recount every campaign from the leads sheet">
            <span class="btn-label"><i class="fa-solid fa-rotate"></i> Sync now</span>
          </button>
          <button class="btn btn-primary" id="newCampBtn">
            <span class="btn-label"><i class="fa-solid fa-plus"></i> Add New Campaign</span>
          </button>
        </div>
      </div>

      <div class="grid grid-5">
        ${UI.statCard({ label: 'Total Leads', value: UI.num(totalLeads), icon: 'fa-users' })}
        ${UI.statCard({ label: 'Total Contacted', value: UI.num(contacted), icon: 'fa-user-check', tone: 'purple' })}
        ${UI.statCard({ label: 'Contacted %', value: UI.pct(contacted, totalLeads), icon: 'fa-flag', tone: 'orange' })}
        ${UI.statCard({ label: 'Replied', value: UI.pct(replies, contacted), sub: UI.num(replies),
                        icon: 'fa-reply', tone: 'green' })}
        ${UI.statCard({ label: 'Bounced', value: UI.pct(bounced, contacted), sub: UI.num(bounced),
                        icon: 'fa-triangle-exclamation', tone: 'red' })}
      </div>


      <div class="card mt-16">
        <div class="card-head">
          <h3>Your campaigns (${list.length})</h3>
          <div class="input-icon" style="max-width:300px">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="search" id="campSearch" placeholder="Search campaigns" value="${UI.esc(state.search)}">
          </div>
        </div>

        ${list.length ? `
        <div class="table-wrap">
          <table class="tbl">
            <thead>
              <tr>
                <th>Campaign</th><th>Status</th><th>Steps</th><th>Leads</th>
                <th>Contacted</th><th>Reply</th><th>Bounce</th><th>Progress</th>
                <th>Window</th><th style="width:90px"></th>
              </tr>
            </thead>
            <tbody>
              ${list.map((c) => {
                // A campaign is finished when every lead has had every step.
                // Dividing by leads alone hit 100% as soon as the cold email
                // was out, with every follow-up still to send.
                const steps  = Math.max(1, c.totalSequenceSteps || 1);
                const target = (c.totalLeads || 0) * steps;
                // stepsSent needs patch N2; without it fall back to the old
                // measure rather than showing a made-up figure.
                const done   = c.stepsSent !== undefined ? c.stepsSent : (c.sentCount || 0);
                const progress = target > 0 ? Math.min(100, (done / target) * 100) : 0;
                return `
                <tr data-id="${UI.esc(c.campaignId)}">
                  <td class="clickable" data-open="${UI.esc(c.campaignId)}" style="max-width:280px">
                    <div class="cell-strong truncate" title="${UI.esc(c.campaignName || c.campaignId)}">
                      ${UI.esc(c.campaignName || c.campaignId)}
                    </div>
                    <div class="cell-sub">${UI.esc(c.campaignId)}</div>
                  </td>
                  <td>
                    <label class="switch" title="Turn sending on or off">
                      <input type="checkbox" class="campToggle" data-cid="${UI.esc(c.campaignId)}"
                             ${c.campaignStatus === 'Active' ? 'checked' : ''}>
                      <span class="track"></span>
                      <span class="switch-label">${UI.esc(c.campaignStatus || 'Unknown')}</span>
                    </label>
                  </td>
                  <td class="num">${UI.num(c.totalSequenceSteps)}</td>
                  <td class="num">${UI.num(c.totalLeads)}</td>
                  <td class="num">${UI.num(c.sentCount)}</td>
                  <td class="num" title="${UI.num(c.replyCount)} replies recorded">
                    ${UI.pct(c.replyCount, c.sentCount)}
                    <div class="cell-sub">${UI.num(c.replyCount)}</div>
                  </td>
                  <td class="num">${UI.pct(c.bouncedEmails, c.sentCount)}</td>
                  <td>
                    <div class="progress"><span style="width:${progress}%"></span></div>
                    <div class="cell-sub" title="${UI.num(done)} of ${UI.num(target)} sends across ${steps} step(s)">
                      ${progress.toFixed(0)}%
                    </div>
                  </td>
                  <td class="muted small nowrap">
                    ${UI.toTimeValue(c.windowStart)
                      ? UI.to12h(c.windowStart) + ' – ' + UI.to12h(c.windowEnd)
                      : '—'}
                  </td>
                  <td class="actions">
                    <button class="icon-btn plain" data-open="${UI.esc(c.campaignId)}" title="Open">
                      <i class="fa-solid fa-pen-to-square"></i></button>
                    <button class="icon-btn plain" data-del="${UI.esc(c.campaignId)}" title="Delete">
                      <i class="fa-solid fa-trash"></i></button>
                  </td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>` : UI.empty({
          icon: 'fa-bullhorn', title: 'No campaigns yet',
          text: 'Create one to start sending.',
        })}
      </div>`;

    view.querySelector('#campSearch').oninput = UI.debounce((e) => {
      state.search = e.target.value;
      paintList(view);
      const box = view.querySelector('#campSearch');
      box.focus();
      box.setSelectionRange(box.value.length, box.value.length);
    }, 300);

    view.querySelector('#campStatus').onchange = (e) => { state.status = e.target.value; paintList(view); };
    view.querySelector('#newCampBtn').onclick = () => newCampaign(view);

    // Counters live on the Campaigns sheet and are normally only written by the
    // 11:30 PM sync, so today's sends read as zero until this is pressed.
    view.querySelector('#syncStatsBtn').onclick = (e) =>
      UI.withSpinner(e.currentTarget, async () => {
        try {
          const res = await API.syncStats();
          UI.toast(res.message || 'Counters are up to date', 'success');
          render(view);
        } catch (err) {
          UI.toastError(err);
        }
      });

    view.querySelectorAll('[data-open]').forEach((el) => {
      el.onclick = () => openDetail(view, el.dataset.open);
    });

    // Quick pause / resume straight from the list.
    view.querySelectorAll('.campToggle').forEach((box) => {
      box.onclick = (e) => e.stopPropagation();     // never open the row
      box.onchange = async (e) => {
        const id = box.dataset.cid;
        const campaign = state.campaigns.find((x) => x.campaignId === id);
        // Off always means Paused, never back to Draft: Draft is the
        // never-launched state and a campaign does not return to it.
        const next = box.checked ? 'Active' : 'Paused';
        const label = box.parentElement.querySelector('.switch-label');
        const previous = label.textContent;

        box.disabled = true;
        label.textContent = box.checked ? 'Starting…' : 'Pausing…';

        try {
          await API.updateCampaign({ campaignId: id, campaignStatus: next });
          if (campaign) campaign.campaignStatus = next;
          label.textContent = next;
          UI.toast(`${campaign?.campaignName || id} is now ${next.toLowerCase()}`, 'success');
        } catch (err) {
          box.checked = !box.checked;                // put the switch back
          label.textContent = previous;
          UI.toastError(err);
        } finally {
          box.disabled = false;
        }
      };
    });

    view.querySelectorAll('[data-del]').forEach((el) => {
      el.onclick = (e) => {
        e.stopPropagation();
        deleteCampaign(el.dataset.del, view);
      };
    });
  }

  /* ── new campaign ─────────────────────────────────────────────────────── */

  /* ── delete ───────────────────────────────────────────────────────────── */

  /**
   * deleteCampaign removes the campaign's rows and cascades campaignStatus
   * 'Deleted' onto its leads — they stop sending but stay in masterLeads, which
   * is why the database looks unchanged afterwards. Archiving first is the only
   * way to get them out, so it is offered here as an explicit choice.
   */
  function deleteCampaign(campaignId, view) {
    UI.modal({
      title: `Delete ${campaignId}`,
      render: (body) => {
        body.innerHTML = `
          <p style="margin:0 0 16px;line-height:1.65;color:var(--muted)">
            The campaign and its sequence steps are removed. Choose what happens to its leads.
          </p>

          <label class="checkbox" style="align-items:flex-start;padding:12px;border:1px solid var(--border);border-radius:var(--radius)">
            <input type="radio" name="leadFate" value="keep" checked>
            <span>
              <strong>Keep the leads</strong>
              <div class="field-help" style="margin-top:3px">
                They stay in the database, marked Deleted, and stop sending. Their email
                addresses still count as duplicates on future uploads.
              </div>
            </span>
          </label>

          <label class="checkbox" style="align-items:flex-start;padding:12px;border:1px solid var(--border);border-radius:var(--radius);margin-top:10px">
            <input type="radio" name="leadFate" value="archive">
            <span>
              <strong>Archive the leads first</strong>
              <div class="field-help" style="margin-top:3px">
                Moves them out of the live database into an archive spreadsheet, then deletes
                the campaign. Those addresses become uploadable again.
              </div>
            </span>
          </label>

          <div class="alert alert-warn mt-16">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <div>Neither can be undone from the app.</div>
          </div>`;
      },
      footer: (foot, close) => {
        const cancel = document.createElement('button');
        cancel.className = 'btn btn-ghost';
        cancel.textContent = 'Cancel';
        cancel.onclick = close;

        const go = document.createElement('button');
        go.className = 'btn btn-danger';
        go.innerHTML = '<span class="btn-label">Delete campaign</span>';
        go.onclick = () => {
          const archive = document.querySelector('input[name="leadFate"]:checked')?.value === 'archive';

          UI.withSpinner(go, async () => {
            try {
              // Archive BEFORE deleting: archiveCampaignLeads looks the campaign
              // up, so it has nothing to work with once the rows are gone.
              if (archive) {
                const res = await API.archiveCampaignLeads(campaignId);
                UI.toast(
                  res.archived !== undefined
                    ? `Archived ${UI.num(res.archived)} lead(s)`
                    : 'Leads archived',
                  'success',
                );
              }
              await API.deleteCampaign(campaignId);
              UI.toast(`${campaignId} deleted`, 'success');
              close();
              render(view);
            } catch (err) { UI.toastError(err); }
          });
        };
        foot.append(cancel, go);
      },
    });
  }

  /* ── duplicate ────────────────────────────────────────────────────────── */

  /**
   * Copies the sequence and every schedule setting into a new campaign.
   * Leads are never copied — a lead belongs to exactly one campaign in this
   * schema, so duplicating them would either move them or create conflicting
   * rows for the same address.
   */
  function duplicateCampaign(btn, c, view) {
    UI.modal({
      title: 'Duplicate campaign',
      render: (body) => {
        const steps = [...(c.steps || [])].sort((a, b) => a.sequenceStep - b.sequenceStep);
        body.innerHTML = `
          <div class="field">
            <label>New campaign name</label>
            <input id="dupName" value="${UI.esc((c.campaignName || c.campaignId) + ' (copy)')}" autofocus>
          </div>

          <div class="card">
            <div class="card-body">
              <div class="kv-list">
                <div class="kv-row"><span>Sequence steps</span><strong>${steps.length} copied</strong></div>
                <div class="kv-row"><span>Sending window</span>
                  <strong>${UI.toTimeValue(c.windowStart)
                    ? UI.to12h(c.windowStart) + ' – ' + UI.to12h(c.windowEnd) : 'not set'}</strong></div>
                <div class="kv-row"><span>Sending days</span><strong>${UI.esc(c.sendingDays) || 'not set'}</strong></div>
                <div class="kv-row"><span>Timezone</span><strong>${UI.esc(c.timezone) || 'not set'}</strong></div>
                <div class="kv-row"><span>Assigned senders</span>
                  <strong>${String(c.assignedSenders || '').split(',').filter(Boolean).length} carried over</strong></div>
                <div class="kv-row"><span>Leads</span><strong>none — starts as a draft</strong></div>
              </div>
            </div>
          </div>

`;
      },
      footer: (foot, close) => {
        const cancel = document.createElement('button');
        cancel.className = 'btn btn-ghost';
        cancel.textContent = 'Cancel';
        cancel.onclick = close;

        const go = document.createElement('button');
        go.className = 'btn btn-primary';
        go.innerHTML = '<span class="btn-label">Create copy</span>';
        go.onclick = () => {
          const name = document.getElementById('dupName').value.trim();
          if (!name) return UI.toast('Give the copy a name', 'warn');

          UI.withSpinner(go, async () => {
            try {
              const steps = [...(c.steps || [])]
                .sort((a, b) => a.sequenceStep - b.sequenceStep)
                .map((s) => ({
                  subjectLine: s.subjectLine || '',
                  emailBody:   s.emailBody || '',
                  awaitDays:   s.awaitDays || 0,
                }));

              const res = await API.createCampaign({
                campaignName:    name,
                campaignStatus:  'Draft',
                assignedSenders: c.assignedSenders || '',
                windowStart:     UI.toTimeValue(c.windowStart),
                windowEnd:       UI.toTimeValue(c.windowEnd),
                sendingDays:     c.sendingDays || '',
                timezone:        c.timezone || '',
                steps,
              });

              UI.toast(`${res.campaignId} created with ${res.rowsCreated} step(s)`, 'success');
              close();
              state.campaigns = await API.getCampaigns();
              openDetail(view, res.campaignId);
            } catch (err) { UI.toastError(err); }
          });
        };
        foot.append(cancel, go);
      },
    });
  }

  async function loadCampLeads(body) {
    const c = detail.campaign;
    const s = detail.leadState;
    const box = body.querySelector('#campLeadsBox');
    box.innerHTML = UI.loading();

    try {
      const res = await API.getLeads({
        campaignId: c.campaignId,
        status: s.status || undefined,
        page: s.page,
        pageSize: s.pageSize,
      });

      if (!res.leads.length) {
        box.innerHTML = UI.empty({ icon: 'fa-user-plus', title: 'No leads yet',
                                   text: 'Upload a CSV above to get started.' });
        return;
      }

      // campaignId is redundant here — every row belongs to this campaign.
      box.innerHTML = `
        ${UI.leadTable(res.leads, {
          hide: ['campaignId'],
          senderEmails: detail.senderEmails || {},
        })}
        ${UI.pager({ page: res.page, pages: res.pages, total: res.total, pageSize: res.pageSize })}`;

      UI.wireLeadTable(box, res.leads, { senderEmails: detail.senderEmails || {} });
      box.querySelector('[data-page-prev]')?.addEventListener('click', () => { s.page--; loadCampLeads(body); });
      box.querySelector('[data-page-next]')?.addEventListener('click', () => { s.page++; loadCampLeads(body); });

      box.innerHTML = UI.errorBox(err.message);

  /* ── CSV upload + column mapping ──────────────────────────────────────── */

  function handleCsv(event, body, view) {
    const file = event.target.files?.[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      const { headers, rows } = parseCSV(String(reader.result || ''));
      if (!headers.length || !rows.length) {
        UI.toast('That file has no readable rows', 'error');
        return;
      }
      paintMapper(body, headers, rows, view);
    };
    reader.onerror = () => UI.toast('Could not read that file', 'error');
    reader.readAsText(file);
  }

  function paintMapper(body, headers, rows, view) {
    const area = body.querySelector('#mapArea');
    const mapping = headers.map(guessField);

    area.innerHTML = `
      <div class="divider"></div>
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <h4 style="font-size:13.5px">Map your columns</h4>
        <span class="badge blue no-dot">${UI.num(rows.length)} rows detected</span>
      </div>

      <div class="map-row" style="border-bottom:1px solid var(--border);padding-bottom:8px">
        <strong class="small muted">CSV COLUMN</strong>
        <span></span>
        <strong class="small muted">LEADS FIELD</strong>
        <strong class="small muted">PREVIEW</strong>
      </div>

      ${headers.map((h, i) => `
        <div class="map-row">
          <div class="map-source">${UI.esc(h)}</div>
          <div class="map-arrow"><i class="fa-solid fa-arrow-right"></i></div>
          <select data-map="${i}">
            <option value="">— skip this column —</option>
            ${UI.LEAD_FIELDS.map((f) =>
              `<option value="${f}"${mapping[i] === f ? ' selected' : ''}>${f}</option>`).join('')}
          </select>
          <div class="map-preview">
            ${rows.slice(0, 3).map((r) => `
              <div class="truncate" title="${UI.esc(r[i])}">${UI.esc(r[i]) || '—'}</div>`).join('')}
          </div>
        </div>`).join('')}

      <div class="divider"></div>

      <div class="grid grid-2">
        <label class="checkbox" style="align-items:flex-start">
          <input type="checkbox" id="skipExisting" checked>
          <span>
            <strong>Skip leads already in the database</strong>
            <div class="field-help" style="margin-top:2px">
              An address that already exists anywhere in masterLeads is ignored, so the same
              person is never contacted twice. Untick only to re-add someone you deleted.
            </div>
          </span>
        </label>
        <label class="checkbox" style="align-items:flex-start">
          <input type="checkbox" id="skipOther" checked>
          <span>
            <strong>Skip leads in other campaigns</strong>
            <div class="field-help" style="margin-top:2px">
              An address already assigned to a different campaign is ignored, so a lead is
              never pulled out of a sequence that is mid-flight.
            </div>
          </span>
        </label>
      </div>

      <div id="uploadWarn"></div>

      <div class="row mt-16">
        <button class="btn btn-primary" id="doUpload">
          <span class="btn-label"><i class="fa-solid fa-upload"></i> Upload leads</span></button>
        <span id="uploadProgress" class="muted small"></span>
      </div>

      <div id="uploadResult" class="mt-16"></div>`;

    const selects = [...area.querySelectorAll('[data-map]')];
    const readMapping = () => selects.map((sel) => sel.value);

    /**
     * A field can only be used once — two columns writing the same field means
     * one silently overwrites the other. Already-taken options are disabled
     * everywhere except the dropdown holding them.
     */
    const syncOptions = () => {
      const taken = new Set(readMapping().filter(Boolean));
      selects.forEach((sel) => {
        [...sel.options].forEach((opt) => {
          if (!opt.value) return;
          opt.disabled = taken.has(opt.value) && opt.value !== sel.value;
        });
      });
    };

    /** Everything that can be checked before sending a single row. */
    const validate = () => {
      const map = readMapping();
      const warn = area.querySelector('#uploadWarn');
      const emailIdx = map.indexOf('email');
      const problems = [];
      let ready = 0;

      if (emailIdx === -1) {
        warn.innerHTML = `
          <div class="alert alert-warn" style="margin-top:14px">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <div>No column is mapped to <strong>email</strong>. Nothing can be uploaded without it.</div>
          </div>`;
        area.querySelector('#doUpload').disabled = true;
        return { ok: false };
      }

      // Walk the file once and count what would actually happen.
      const seen = new Set();
      let blank = 0, malformed = 0, dupeInFile = 0;

      rows.forEach((r) => {
        const raw = String(r[emailIdx] ?? '').trim().toLowerCase();
        if (!raw)                    { blank++;      return; }
        if (!UI.looksLikeEmail(raw)) { malformed++;  return; }
        if (seen.has(raw))           { dupeInFile++; return; }
        seen.add(raw);
        ready++;
      });

      if (blank)      problems.push(`${UI.num(blank)} row(s) have no email and will be skipped`);
      if (malformed)  problems.push(`${UI.num(malformed)} row(s) have something that is not an email address`);
      if (dupeInFile) problems.push(`${UI.num(dupeInFile)} row(s) repeat an address already in this file`);

      area.querySelector('#doUpload').disabled = ready === 0;

      warn.innerHTML = `
        <div class="alert ${ready === 0 ? 'alert-error' : problems.length ? 'alert-warn' : 'alert-ok'}"
             style="margin-top:14px">
          <i class="fa-solid ${ready === 0 ? 'fa-circle-exclamation'
                              : problems.length ? 'fa-triangle-exclamation' : 'fa-circle-check'}"></i>
          <div>
            <strong>${UI.num(ready)} of ${UI.num(rows.length)} row(s) will be sent.</strong>
            ${problems.length ? `<ul style="margin:6px 0 0;padding-left:18px">
              ${problems.map((p) => `<li>${UI.esc(p)}</li>`).join('')}</ul>` : ''}
            ${ready > 0 ? `<div style="margin-top:6px">The backend then applies the two
              rules above, so the number actually inserted can be lower.</div>` : ''}
          </div>
        </div>`;

      return { ok: ready > 0, emailIdx, ready };
    };

    const refresh = () => { syncOptions(); validate(); };
    selects.forEach((sel) => { sel.onchange = refresh; });
    refresh();

    area.querySelector('#doUpload').onclick = (e) => {
      const check = validate();
      if (!check.ok) return UI.toast('Nothing valid to upload', 'warn');

      const map = readMapping();
      const seen = new Set();
      const leads = [];

      rows.forEach((r) => {
        const email = String(r[check.emailIdx] ?? '').trim();
        const key = email.toLowerCase();
        if (!email || !UI.looksLikeEmail(email) || seen.has(key)) return;
        seen.add(key);

        const obj = {};
        map.forEach((field, i) => {
          if (field) obj[field] = String(r[i] ?? '').trim();
        });
        leads.push(obj);
      });

      if (!leads.length) return UI.toast('No valid rows to upload', 'error');
      uploadInChunks(e.currentTarget, area, leads, body);
    };
  }

  /**
   * uploadLeads takes the whole array in one POST and Apps Script has a
   * 6-minute execution limit, so large files go up in chunks.
   */
  async function uploadInChunks(btn, area, leads, body) {
    const CHUNK = 1000;
    const chunks = [];
    for (let i = 0; i < leads.length; i += CHUNK) chunks.push(leads.slice(i, i + CHUNK));

    const progress = area.querySelector('#uploadProgress');
    const result   = area.querySelector('#uploadResult');
    const skipExisting = area.querySelector('#skipExisting').checked;
    const skipOther    = area.querySelector('#skipOther').checked;

    const totals = { inserted: 0, dup: 0, other: 0, noEmail: 0, blocked: 0 };

    await UI.withSpinner(btn, async () => {
      for (let i = 0; i < chunks.length; i++) {
        progress.textContent = `Uploading batch ${i + 1} of ${chunks.length}…`;
        try {
          const res = await API.uploadLeads({
            campaignId: detail.campaign.campaignId,
            leads: chunks[i],
            skipExisting,
            skipOtherCamps: skipOther,
          });
          totals.inserted += res.inserted || 0;
          totals.dup      += res.skippedDuplicate || 0;
          totals.other    += res.skippedOtherCamp || 0;
          totals.noEmail  += res.skippedNoEmail || 0;
          // Backend typo: the field really is "kippedBlocklist" (missing s).
          totals.blocked  += res.skippedBlocklist ?? res.kippedBlocklist ?? 0;
        } catch (err) {
          result.innerHTML = UI.errorBox(`Batch ${i + 1} failed: ${err.message}`);
          progress.textContent = '';
          return;
        }
      }

      progress.textContent = '';
      result.innerHTML = `
        <div class="alert alert-ok">
          <i class="fa-solid fa-circle-check"></i>
          <div>
            <strong>${UI.num(totals.inserted)} lead(s) inserted.</strong><br>
            Skipped — ${UI.num(totals.dup)} duplicate,
            ${UI.num(totals.other)} in another campaign,
            ${UI.num(totals.noEmail)} without an email,
            ${UI.num(totals.blocked)} on the blocklist.
          </div>
        </div>`;
      UI.toast(`${totals.inserted} lead(s) uploaded`, 'success');
      loadCampLeads(body);
    });
  }

          confirmLabel: 'Remove step',

        applySetSteps(e.currentTarget, kept, 'Step removed');

    };

  /* ── preview ──────────────────────────────────────────────────────────── */

  /**
   * Resolves a step exactly the way the sender does: spintax first, then
   * variables — the order replaceVariables() uses, so a variable inside a
   * chosen spintax option still gets substituted.
   */
  function resolveTemplate(text, lead, sender) {
    const withSpin = String(text || '').replace(
      /\[\[\s*random\s*\|(.*?)\]\]/gis,
      (_, opts) => {
        const list = opts.split('|').map((o) => o.trim()).filter(Boolean);
        return list.length ? list[Math.floor(Math.random() * list.length)] : '';
      },
    );

    const missing = new Set();
    const resolved = withSpin.replace(/\{\{(.*?)\}\}/g, (_, rawKey) => {
      const key = rawKey.trim();
      if (lead[key] !== undefined && lead[key] !== '') return String(lead[key]);
      if (sender[key] !== undefined && sender[key] !== '') return String(sender[key]);
      missing.add(key);
      return '';                        // the sender does the same — never leaves {{…}}
    });

    return { resolved, missing: [...missing] };
  }

  function previewStep(btn, campaign, sequenceStep, edited) {
    UI.withSpinner(btn, async () => {
      let lead = {}, sender = {};

      try {
        const [leadRes, senders] = await Promise.all([
          API.getLeads({ campaignId: campaign.campaignId, page: 1, pageSize: 1 }),
          API.getSenders(),
        ]);
        lead = leadRes.leads?.[0] || {};

        const assigned = String(campaign.assignedSenders || '')
          .split(',').map((x) => x.trim()).filter(Boolean);
        const chosen = senders.find((s) => assigned.includes(s.emailID) && s.isActive === 'Active')
                    || senders.find((s) => s.isActive === 'Active')
                    || senders[0] || {};
        sender = {
          senderFirstName: chosen.emailFirstName || '',
          senderLastName:  chosen.emailLastName || '',
        };
        sender.__address = chosen.emailAddress || chosen.emailID || '';
      } catch (err) {
        UI.toastError(err);
        return;
      }

      const subject = resolveTemplate(edited.subjectLine, lead, sender);
      const bodyOut = resolveTemplate(edited.emailBody, lead, sender);
      const missing = [...new Set([...subject.missing, ...bodyOut.missing])];

      UI.modal({
        title: `Preview — step ${sequenceStep}`, size: 'large',
        render: (el) => {
          el.innerHTML = `
            ${lead.email ? '' : `
              <div class="alert alert-warn">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <div>This campaign has no leads yet, so every variable resolved to empty.
                     Upload leads to preview with real data.</div>
              </div>`}

            <div class="card">
              <div class="card-body">
                <div class="kv-row"><span>From</span>
                  <strong>${UI.esc(sender.__address || '—')}</strong></div>
                <div class="kv-row" style="margin-top:8px"><span>To</span>
                  <strong>${UI.esc(lead.email || '—')}</strong></div>
                <div class="divider"></div>
                <div class="muted small" style="margin-bottom:4px">Subject</div>
                <div class="cell-strong">${UI.esc(subject.resolved) || '<em class="muted">empty</em>'}</div>
                <div class="divider"></div>
                <div style="white-space:pre-wrap;line-height:1.7;font-size:13.5px">${
                  UI.esc(bodyOut.resolved) || '<em class="muted">empty</em>'}</div>
              </div>
            </div>

            ${missing.length ? `
              <div class="alert alert-warn mt-16">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <div><strong>Resolved to empty:</strong> ${missing.map((k) => '{{' + UI.esc(k) + '}}').join(', ')}.
                     <br>Either the lead has no value for it, or the name is wrong — the sender
                     also substitutes empty text, so this is exactly what would go out.</div>
              </div>` : ''}

`;
        },
      });
    });
  }

    /* window preview in 12-hour form, plus start/end ordering check */
    const startEl = body.querySelector('#stStart');

    const mins = (v) => {
      const m = String(v || '').match(/^(\d{1,2}):(\d{2})/);
      return m ? Number(m[1]) * 60 + Number(m[2]) : null;
    };

    const windowValid = () => {
      const a = mins(startEl.value), b = mins(endEl.value);

      body.querySelector('#windowPreview').textContent =

    let coldTouched = false;

      const cold = parseFloat(slider.value);
      const suffix = coldTouched ? ''
                   : coldSource === 'global'  ? '  (inherited)'
                   : coldSource === 'unknown' ? '  (not set)'

      out.textContent = coldSource === 'unknown' && !coldTouched
