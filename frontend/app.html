        : `${Math.round(cold * 100)}% cold · ${Math.round((1 - cold) * 100)}% follow-up${suffix}`;

      body.querySelectorAll('.pref-opt').forEach((el) => {
        el.classList.toggle(
          'selected',
          coldSource !== 'unknown' || coldTouched
            ? Math.abs(parseFloat(el.dataset.cold) - cold) < 0.001
            : false,
        );
      });
    };

    slider.oninput = () => { coldTouched = true; syncMix(); };
    body.querySelectorAll('.pref-opt').forEach((el) => {
      el.onclick = () => {
        slider.disabled = false;
        slider.value = el.dataset.cold;
        coldTouched = true;
        syncMix();
      };
    });
    syncMix();

    /* sender selection */
    const countBadge = body.querySelector('#assignedCount');
    const allBox     = body.querySelector('#selAllSenders');
    const boxes      = [...body.querySelectorAll('.senderBox')];

    const refreshCount = () => {
      const checked = boxes.filter((cb) => cb.checked).length;
      countBadge.textContent = `${checked} selected`;
      allBox.checked = checked > 0 && checked === boxes.length;
      allBox.indeterminate = checked > 0 && checked < boxes.length;
    };

    boxes.forEach((cb) => { cb.onchange = refreshCount; });
    allBox.onchange = () => {
      boxes.forEach((cb) => { cb.checked = allBox.checked; });
      refreshCount();
    };
    body.querySelector('#selActiveSenders').onclick = () => {
      boxes.forEach((cb) => { cb.checked = cb.dataset.active === '1'; });
      refreshCount();
    };
    body.querySelector('#clearSenders').onclick = () => {
      boxes.forEach((cb) => { cb.checked = false; });
      refreshCount();
    };
    refreshCount();

    /* Tag picker — populated lazily so this tab does not pay for it on load. */
    const tagPicker = body.querySelector('#tagPicker');
    API.getAllTags().then((tags) => {
      if (!tagPicker.isConnected) return;
      UI.setTagColors(tags);
      tagPicker.innerHTML = tags.length
        ? '<option value="">— pick a tag —</option>' + tags.map((t) =>
            `<option value="${UI.esc(t.tagName)}">${UI.esc(t.tagName)} — ${t.senderCount} sender(s)</option>`).join('')
        : '<option value="">no tags created yet</option>';
    }).catch(() => {
      tagPicker.innerHTML = '<option value="">could not load tags</option>';
    });

    body.querySelector('#applyTagBtn').onclick = (e) => {
      const tag = tagPicker.value;
      if (!tag) return UI.toast('Pick a tag first', 'warn');

      UI.withSpinner(e.currentTarget, async () => {
        try {
          const tagged = await API.getSendersByTag(tag);
          const ids = new Set(tagged.map((s) => s.emailID));
          let added = 0;
          boxes.forEach((cb) => {
            if (ids.has(cb.value) && !cb.checked) { cb.checked = true; added++; }
          });
          refreshCount();
          UI.toast(
            added ? `Added ${added} sender(s) tagged "${tag}" — remember to Save`
                  : `All senders tagged "${tag}" were already selected`,
            added ? 'success' : 'info',
          );
        } catch (err) { UI.toastError(err); }
      });
    };

    body.querySelector('#stSave').onclick = (e) => {
      if (!windowValid()) return UI.toast('Fix the sending window before saving', 'warn');

      const days = [...body.querySelectorAll('.dayBox:checked')].map((cb) => cb.value);
      const ids  = boxes.filter((cb) => cb.checked).map((cb) => cb.value);
      const cold = parseFloat(slider.value);

      UI.withSpinner(e.currentTarget, async () => {
        try {
          const payload = {
            campaignId:      c.campaignId,
            campaignName:    body.querySelector('#stName').value.trim(),
            windowStart:     startEl.value,
            windowEnd:       endEl.value,
            timezone:        body.querySelector('#stTz').value,
            sendingDays:     days.join(','),
            assignedSenders: ids.join(','),      // backend stores a CSV string
            // Ignored by the stock backend; saved once the updateCampaign patch
            // in BACKEND-PATCH.md is installed.
            notes:                 body.querySelector('#stNotes').value,
          };

          // Only send the mix if the user actually chose one. Sending an
          // untouched inherited value would copy the global setting onto this
          // campaign and quietly break the link to it.
          if (coldTouched) {
            payload.coldPriorityLimit     = cold;
            payload.followupPriorityLimit = Math.round((1 - cold) * 100) / 100;
          }
          const res = await API.updateCampaign(payload);
          Object.assign(c, payload);
          UI.toast('Campaign settings saved', 'success');

          // The patched handler echoes totalSequenceSteps; the stock one does
          // not, and quietly drops notes and the priority limits.
          const notesChanged = (payload.notes || '') !== (c.notes || '');
          if (res.totalSequenceSteps === undefined && (notesChanged || payload.notes)) {
            UI.toast(
              'Notes and sending mix were not saved — this Master Control still runs the stock updateCampaign. See BACKEND-PATCH.md.',
              'warn', 9000,
            );
          }
        } catch (err) { UI.toastError(err); }
      });
    };
  }

  /* ── test email ───────────────────────────────────────────────────────── */

  function testEmailModal(campaign, step = 1) {
    UI.modal({
      title: 'Send a test email',
      render: async (body) => {
        body.innerHTML = UI.loading('Loading senders…');
        let senders = [];
        try { senders = await API.getSenders(); } catch { /* optional */ }

        const active = senders.filter((s) => s.isActive === 'Active');
        const steps = [...(campaign.steps || [])].sort((a, b) => a.sequenceStep - b.sequenceStep);

        body.innerHTML = `
          <div class="field">
            <label>Sequence step</label>
            <select id="teStep">
              ${steps.map((s) => `
                <option value="${s.sequenceStep}"${s.sequenceStep === step ? ' selected' : ''}>
                  Step ${s.sequenceStep} — ${UI.esc(s.subjectLine || 'no subject yet')}
                </option>`).join('')}
            </select>
          </div>

          <div class="field">
            <label>Send to</label>
            <input type="email" id="teEmail" placeholder="you@yourcompany.com">
          </div>

          <div class="field">
            <label>Send from</label>
            <select id="teSender">
              <option value="">First active sender assigned to this campaign</option>
              ${active.map((s) =>
                `<option value="${UI.esc(s.emailID)}">${UI.esc(s.emailAddress || s.emailID)}</option>`).join('')}
            </select>
          </div>


          <div id="teResult"></div>`;
      },
      footer: (foot, close) => {
        const cancel = document.createElement('button');
        cancel.className = 'btn btn-ghost';
        cancel.textContent = 'Cancel';
        cancel.onclick = close;

        const send = document.createElement('button');
        send.className = 'btn btn-primary';
        send.innerHTML = '<span class="btn-label">Send test</span>';
        send.onclick = () => {
          const testEmail = document.getElementById('teEmail')?.value.trim();
          if (!testEmail) return UI.toast('Enter an address to send to', 'warn');

          UI.withSpinner(send, async () => {
            const out = document.getElementById('teResult');
            try {
              const res = await API.sendTestEmail({
                campaignId:   campaign.campaignId,
                sequenceStep: parseInt(document.getElementById('teStep').value, 10),
                testEmail,
                senderId:     document.getElementById('teSender').value || undefined,
              });
              out.innerHTML = `
                <div class="alert alert-ok">
                  <i class="fa-solid fa-circle-check"></i>
                  <div>Sent to <strong>${UI.esc(res.sentTo || testEmail)}</strong>
                       from <strong>${UI.esc(res.sentFrom || res.usedSender || '')}</strong>.<br>
                       Subject: ${UI.esc(res.subject || '—')}</div>
                </div>`;
              UI.toast('Test email sent', 'success');
            } catch (err) {
              out.innerHTML = UI.errorBox(err.message);
            }
          });
        };
        foot.append(cancel, send);
      },
    });
  }

  return { render };
})();

/* ==========================================================================
   leads.js — TAB 4 (read-only view of the whole leads database)

   Note on cost: getLeads reads the entire masterLeads sheet server-side, then
   filters and pages in memory. Every page flip is a full re-read, so filters
   are applied on an explicit Search press rather than on every keystroke.
   ========================================================================== */

const Leads = (() => {

  let state = {
    campaigns: [],
    campaignId: '', status: '', outcome: '', search: '',
    page: 1, pageSize: 50,
    result: null, loading: false, error: '', senderEmails: {},
  };

  const STATUSES = ['Pending', 'Queued', 'Sending', 'Sent', 'Error'];

  async function render(view) {
    view.innerHTML = UI.loading('Loading leads…');

    try {
      state.campaigns = await API.getCampaigns();
    } catch {
      state.campaigns = [];              // filter is a convenience, not a blocker
    }

    // ownerSender holds an emailID like S001; show the actual address instead.
    try {
      const senders = await API.getSenders();
      state.senderEmails = Object.fromEntries(
        senders.map((x) => [x.emailID, x.emailAddress]).filter(([, a]) => a));
    } catch {
      state.senderEmails = {};
    }

    paint(view);
    await load(view);
  }

  function paint(view) {
    view.innerHTML = `
      <div class="section-head">
        <h1>Leads</h1>
        <div class="row row-end">
          <span class="muted small">Read-only view of the leads database</span>
        </div>
      </div>

      <div class="card">
        <div class="card-body" style="padding-bottom:14px">
          <div class="row" style="gap:10px">
            <div class="input-icon" style="flex:1;min-width:220px">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="search" id="ldSearch" placeholder="Search by email, name or company"
                     value="${UI.esc(state.search)}">
            </div>

            <select id="ldCampaign" style="width:auto;min-width:180px">
              <option value="">All campaigns</option>
              ${state.campaigns.map((c) => `
                <option value="${UI.esc(c.campaignId)}"${state.campaignId === c.campaignId ? ' selected' : ''}>
                  ${UI.esc(c.campaignName || c.campaignId)}
                </option>`).join('')}
            </select>

            <select id="ldStatus" style="width:auto">
              <option value="">All statuses</option>
              ${STATUSES.map((s) =>
                `<option value="${s}"${state.status === s ? ' selected' : ''}>${s}</option>`).join('')}
            </select>

            <select id="ldOutcome" style="width:auto">
              <option value="">Any outcome</option>
              <option value="replied"${state.outcome === 'replied' ? ' selected' : ''}>Replied</option>
              <option value="bounced"${state.outcome === 'bounced' ? ' selected' : ''}>Bounced</option>
              <option value="clean"${state.outcome === 'clean' ? ' selected' : ''}>No reply / no bounce</option>
            </select>

            <select id="ldPageSize" style="width:auto">
              ${[25, 50, 100, 200].map((n) =>
                `<option value="${n}"${state.pageSize === n ? ' selected' : ''}>${n} / page</option>`).join('')}
            </select>

            <button class="btn btn-primary" id="ldSearchBtn">
              <span class="btn-label"><i class="fa-solid fa-magnifying-glass"></i> Search</span>
            </button>
          </div>
          <div class="field-help">
            Search and outcome filter apply to the current page of results. Campaign and status
            are applied by the backend across the whole database.
          </div>
        </div>

        <div id="ldBox"></div>
      </div>`;

    view.querySelector('#ldSearchBtn').onclick = () => { state.page = 1; load(view); };
    view.querySelector('#ldSearch').onkeydown = (e) => {
      if (e.key === 'Enter') { state.page = 1; load(view); }
    };
    view.querySelector('#ldCampaign').onchange = (e) => { state.campaignId = e.target.value; state.page = 1; load(view); };
    view.querySelector('#ldStatus').onchange   = (e) => { state.status = e.target.value; state.page = 1; load(view); };
    view.querySelector('#ldOutcome').onchange  = (e) => { state.outcome = e.target.value; paintTable(view); };
    view.querySelector('#ldPageSize').onchange = (e) => { state.pageSize = +e.target.value; state.page = 1; load(view); };
  }

  async function load(view) {
    const box = view.querySelector('#ldBox');
    if (!box) return;
    box.innerHTML = UI.skeletonRows(8, 7);

    state.search = view.querySelector('#ldSearch')?.value || '';

    try {
      // `search` is understood only once Patch 8 is applied. The stock handler
      // ignores unknown params, so this is safe either way — serverSearch below
      // detects which happened.
      state.result = await API.getLeads({
        campaignId: state.campaignId || undefined,
        status:     state.status || undefined,
        search:     state.search.trim() || undefined,
        page:       state.page,
        pageSize:   state.pageSize,
      });
      state.serverSearched = state.result.searched === true;
      state.error = '';
    } catch (err) {
      state.error = err.message;
      state.result = null;
    }
    paintTable(view);
  }

  /** Client-side refinement on the page the backend returned. */
  function visibleRows() {
    if (!state.result) return [];
    const q = state.search.trim().toLowerCase();
    return state.result.leads.filter((l) => {
      if (state.outcome === 'replied' && String(l.replyStatus).toLowerCase() !== 'replied') return false;
      if (state.outcome === 'bounced' && String(l.bounceStatus).toLowerCase() !== 'bounced') return false;
      if (state.outcome === 'clean' && (l.replyStatus || l.bounceStatus)) return false;
      // When the backend did the search, every returned row already matches;
      // re-filtering here would only narrow it wrongly on fields it omits.
      if (!q || state.serverSearched) return true;
      return [l.email, l.firstName, l.lastName, l.companyName, l.leadId]
        .some((v) => String(v || '').toLowerCase().includes(q));
    });
  }

  /**
   * The stock getLeads has no search parameter, so a search can only sift the
   * page already loaded — type an address that lives on page 7 and page 1
   * shows nothing, which reads as a broken button. Say so plainly.
   */
  function searchScopeNote() {
    if (!state.search.trim() || state.serverSearched) return '';
    return `
      <div class="alert alert-warn" style="margin:12px 16px 0">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <div>This search only covers the ${UI.num(state.result?.leads.length || 0)} rows on
             this page, because this backend cannot search the whole database yet.
             A lead on another page will not appear — page through, narrow by campaign,
             or apply Patch 8 from BACKEND-PATCH.md to search everything.</div>
      </div>`;
  }

  function paintTable(view) {
    const box = view.querySelector('#ldBox');
    if (!box) return;

    if (state.error) { box.innerHTML = UI.errorBox(state.error); return; }
    if (!state.result) { box.innerHTML = UI.loading(); return; }

    const rows = visibleRows();
    const r = state.result;

    if (!rows.length) {
      box.innerHTML = UI.empty({
        icon: 'fa-users-slash',
        title: 'No leads match',
        text: r.total > 0
          ? 'Nothing on this page matches the search. Try another page or clear the filter.'
          : 'Upload leads from a campaign to get started.',
      });
      box.insertAdjacentHTML('afterbegin', searchScopeNote());
      if (r.total > 0) box.insertAdjacentHTML('beforeend',
        UI.pager({ page: r.page, pages: r.pages, total: r.total, pageSize: r.pageSize }));
      wirePager(view);
      return;
    }

    box.innerHTML = `
      ${searchScopeNote()}
      ${UI.leadTable(rows, { senderEmails: state.senderEmails })}
      ${rows.length !== r.leads.length
        ? `<div style="padding:10px 16px" class="muted small">
             Showing ${UI.num(rows.length)} of ${UI.num(r.leads.length)} rows on this page after filtering.
           </div>`
        : ''}
      ${UI.pager({ page: r.page, pages: r.pages, total: r.total, pageSize: r.pageSize })}`;

    UI.wireLeadTable(box, rows, { senderEmails: state.senderEmails });
    wirePager(view);
  }

  function wirePager(view) {
    view.querySelector('[data-page-prev]')?.addEventListener('click', () => { state.page--; load(view); });
    view.querySelector('[data-page-next]')?.addEventListener('click', () => { state.page++; load(view); });
  }

  return { render };
})();

              <span class="btn-label"><i class="fa-solid fa-envelope-open-text"></i> Send Daily Digest</span></button>
            <button class="btn" data-sys="systemBoot" data-label="System boot"
                    data-confirm="This recreates every scheduled trigger on the master control and on all senders. Run it once during setup, or after triggers were wiped. Continue?">
              <span class="btn-label"><i class="fa-solid fa-power-off"></i> System Boot</span></button>
            <button class="btn" data-sys="resetOrphanedLeads" data-label="Reset orphaned leads"
                    data-confirm="Reset leads that are stuck mid-send back to their correct state?">
              <span class="btn-label"><i class="fa-solid fa-link-slash"></i> Reset Orphaned Leads</span></button>
            <button class="btn btn-danger" data-sys="purgeAllInboxes" data-label="Purge all inboxes"
                    data-confirm="This clears the queue on EVERY sender and resets those leads. Anything queued but not yet sent is lost and must be redistributed. Continue?">
              <span class="btn-label"><i class="fa-solid fa-trash-can"></i> Purge All Inboxes</span></button>
          </div>
          <div id="sysOut" class="mt-16"></div>
        </div>
      </div>`;

    wire(view);
  }

  /* ── events ───────────────────────────────────────────────────────────── */

  function wire(view) {
    const q = (sel) => view.querySelector(sel);

    /** Saves a subset of settings and reports anything the backend rejected. */
    const save = (btn, payload) => UI.withSpinner(btn, async () => {
      try {
        const res = await API.updateSettings(payload);
        if (res.rejected?.length) {
          UI.toast(`Saved. Backend rejected: ${res.rejected.join(', ')}`, 'warn', 8000);
        } else {
          UI.toast(`Saved ${res.updated.length} setting(s)`, 'success');
        }
        state.settings = await API.getSettings();
      } catch (err) { UI.toastError(err); }
    });

    q('#saveSending').onclick = (e) => save(e.currentTarget, {
      coldPriorityLimit:     q('#setCold').value,
      followupPriorityLimit: q('#setFollow').value,
      distributionMethod:    q('#setMethod').value,
      alertsEmail:           q('#setAlerts').value.trim(),
      flexibleAllocation:    q('#setFlexible').checked ? 'TRUE' : 'FALSE',
    });

    q('#saveWarmup').onclick = (e) => save(e.currentTarget, {
      warmupEnabled:    q('#wuEnabled').checked ? 'TRUE' : 'FALSE',
      warmupStartLimit: q('#wuStart').value,
      warmupIncreaseBy: q('#wuBy').value,
      warmupEveryDays:  q('#wuEvery').value,
      warmupMaxLimit:   q('#wuMax').value,
    });

    q('#runWarmup').onclick = (e) => UI.withSpinner(e.currentTarget, async () => {
      try {
        const res = await API.op('runWarmupIncrease');
        UI.toast(res.message || 'Ramp up increase ran', 'success');
      } catch (err) { UI.toastError(err); }
    });

    /* ── bulk sender update ───────────────────────────────────────────────
     * Senders and tags are chosen from real lists rather than typed. Free
     * text meant remembering every sender ID, and let any string through for
     * isActive — which the backend writes verbatim, so a typo silently takes
     * an account out of the sending pool.
     */
    const target     = q('#bulkTarget');
    const targetWrap = q('#bulkTargetValWrap');
    const valueWrap  = q('#bulkValueWrap');
    const countEl    = q('#bulkTargetCount');

    const paintTarget = async () => {
      countEl.textContent = '';

      if (target.value === 'all') {
        targetWrap.innerHTML = '';
        try {
          const senders = await API.getSenders();
          countEl.textContent = `${senders.length} sender(s) will be updated`;
        } catch { /* count is informational only */ }
        return;
      }

      targetWrap.innerHTML = UI.loading();

      if (target.value === 'tag') {
        try {
          const tags = await API.getAllTags();
          UI.setTagColors(tags);
          targetWrap.innerHTML = tags.length ? `
            <div class="field">
              <label>Tag</label>
              <select id="bulkTag">
                ${tags.map((t) => `
                  <option value="${UI.esc(t.tagName)}">
                    ${UI.esc(t.tagName)} — ${t.senderCount} sender(s)
                  </option>`).join('')}
              </select>
            </div>`
            : UI.errorBox('No tags exist yet. Add one from a sender panel in Email Accounts.');
        } catch (err) {
          targetWrap.innerHTML = UI.errorBox(err.message);
        }
        return;
      }

      // Explicit sender picking.
      try {
        const senders = await API.getSenders();
        targetWrap.innerHTML = `
          <div class="field">
            <label>Senders</label>
            <label class="checkbox" style="padding:8px 4px;border-bottom:1px solid var(--border);margin-bottom:8px;width:100%">
              <input type="checkbox" id="bulkSelAll">
              <strong>Select all ${senders.length}</strong>
            </label>
            <div class="list-scroll">
              ${senders.map((s) => `
                <label class="checkbox" style="display:flex;padding:6px 4px">
                  <input type="checkbox" class="bulkSender" value="${UI.esc(s.emailID)}">
                  <span style="flex:1">${UI.esc(s.emailAddress || s.emailID)}</span>
                  <span class="muted small">${UI.esc(s.emailID)}</span>
                  <span class="badge ${s.isActive === 'Active' ? 'green' : 'orange'}">${UI.esc(s.isActive)}</span>
                </label>`).join('')}
            </div>
          </div>`;

        const boxes = [...targetWrap.querySelectorAll('.bulkSender')];
        const allBox = targetWrap.querySelector('#bulkSelAll');
        const sync = () => {
          const n = boxes.filter((b) => b.checked).length;
          countEl.textContent = n ? `${n} sender(s) selected` : '';
          allBox.checked = n > 0 && n === boxes.length;
          allBox.indeterminate = n > 0 && n < boxes.length;
        };
        boxes.forEach((b) => { b.onchange = sync; });
        allBox.onchange = () => { boxes.forEach((b) => { b.checked = allBox.checked; }); sync(); };
      } catch (err) {
        targetWrap.innerHTML = UI.errorBox(err.message);
      }
    };

    /** The value control follows the field, so isActive can only be valid. */
    const paintValue = () => {
      const field = q('#bulkField').value;

      if (field === 'rampUp') {
        valueWrap.innerHTML = `
          <label>Ramp up</label>
          <select id="bulkValue">
            <option value="Active">Active — daily limit climbs</option>
            <option value="">Off — stays where it is</option>
          </select>
          <div class="field-help">
            Only senders set to Active are touched when ramp up runs, so
            established accounts keep their limit when you add new ones.
          </div>`;
      } else if (field === 'isActive') {
        valueWrap.innerHTML = `
          <label>New status</label>
          <select id="bulkValue">
            <option value="Active">Active</option>
            <option value="Paused">Paused</option>
          </select>
          <div class="field-help">
            The backend stores this verbatim and treats anything other than
            <code>Active</code> as paused, so it is a fixed list here.
          </div>`;
      } else if (field === 'dailyLimit') {
        valueWrap.innerHTML = `
          <label>New daily limit</label>
          <input type="number" id="bulkValue" min="0" max="500" value="25">`;
      } else {
        valueWrap.innerHTML = `
          <label>New value</label>
          <input id="bulkValue" placeholder="${field === 'senderFirstName' ? 'e.g. Alex' : 'e.g. Morgan'}">`;
      }
    };

    target.onchange = paintTarget;
    q('#bulkField').onchange = paintValue;
    paintTarget();
    paintValue();

    q('#bulkApply').onclick = (e) => {
      const field = q('#bulkField').value;
      const raw   = String(q('#bulkValue')?.value ?? '').trim();

      if (!raw && field !== 'senderFirstName' && field !== 'senderLastName' && field !== 'rampUp') {
        return UI.toast('Choose a new value', 'warn');
      }
      const fields = { [field]: field === 'dailyLimit' ? parseInt(raw, 10) || 0 : raw };

      UI.withSpinner(e.currentTarget, async () => {
        try {
          if (target.value === 'tag') {
            const tag = q('#bulkTag')?.value;
            if (!tag) return UI.toast('Pick a tag', 'warn');
            const res = await API.updateSendersByTag({ tag, fields });
            UI.toast(`Updated ${res.senders} sender(s) tagged "${tag}" — ${res.synced} synced, ${res.failed} failed`, 'success');

          } else if (target.value === 'ids') {
            const senderIds = [...document.querySelectorAll('.bulkSender:checked')].map((b) => b.value);
            if (!senderIds.length) return UI.toast('Select at least one sender', 'warn');
            const res = await API.updateSenderConfig({ senderIds, fields });
            UI.toast(`Updated ${res.updated} sender(s) — ${res.synced} synced, ${res.failed} failed`, 'success');

          } else {
            const ok = await UI.confirm({
              title: 'Update every sender',
              message: `This applies ${field} = "${raw}" to all senders on this backend. Continue?`,
              confirmLabel: 'Update all',
              danger: false,
            });
            if (!ok) return;
            const res = await API.updateSenderConfig({ senderIds: 'all', fields });
            UI.toast(`Updated ${res.updated} sender(s) — ${res.synced} synced, ${res.failed} failed`, 'success');
          }
        } catch (err) { UI.toastError(err); }
      });
    };

    /* blocklist */
    q('#loadBlocklist').onclick = (e) => UI.withSpinner(e.currentTarget, async () => {
      const box = q('#blList');
      try {
        const bl = await API.getBlocklist();
        const rows = [
          ...bl.emails.map((x) => ({ kind: 'Email', value: x.email, reason: x.reason, date: x.dateAdded })),
          ...bl.domains.map((x) => ({ kind: 'Domain', value: x.domain, reason: x.reason, date: x.dateAdded })),
        ];
        if (!rows.length) {
          box.innerHTML = UI.empty({ icon: 'fa-ban', title: 'Blocklist is empty' });
          return;
        }
        box.innerHTML = `
          <div class="table-wrap" style="border:1px solid var(--border);border-radius:var(--radius)">
            <table class="tbl">
              <thead><tr><th>Type</th><th>Value</th><th>Reason</th><th>Added</th><th></th></tr></thead>
              <tbody>
                ${rows.map((r) => `
                  <tr>
                    <td><span class="badge no-dot">${r.kind}</span></td>
                    <td class="cell-strong">${UI.esc(r.value)}</td>
                    <td class="muted">${UI.esc(r.reason) || '—'}</td>
                    <td class="muted small">${UI.esc(r.date) || '—'}</td>
                    <td class="actions">
                      <button class="icon-btn plain" data-unblock="${UI.esc(r.value)}"
                              data-kind="${r.kind}" title="Remove">
                        <i class="fa-solid fa-xmark"></i></button>
                    </td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>`;

        box.querySelectorAll('[data-unblock]').forEach((btn) => {
          btn.onclick = async () => {
            const value = btn.dataset.unblock;
            const payload = btn.dataset.kind === 'Email' ? { emails: [value] } : { domains: [value] };
            try {
              const res = await API.removeFromBlocklist(payload);
              UI.toast(`Removed ${res.removed} entr${res.removed === 1 ? 'y' : 'ies'}`, 'success');
              q('#loadBlocklist').click();
            } catch (err) { UI.toastError(err); }
          };
        });
      } catch (err) {
        box.innerHTML = UI.errorBox(err.message);
      }
    });

    q('#blAdd').onclick = (e) => {
      const split = (v) => v.split('\n').map((x) => x.trim()).filter(Boolean);
      const emails  = split(q('#blEmails').value);
      const domains = split(q('#blDomains').value);
      if (!emails.length && !domains.length) return UI.toast('Add at least one email or domain', 'warn');

      UI.withSpinner(e.currentTarget, async () => {
        try {
          const res = await API.addToBlocklist({ emails, domains, reason: q('#blReason').value.trim() || 'manual' });
          UI.toast(`Blocked ${res.addedEmails} email(s) and ${res.addedDomains} domain(s)`, 'success');
          q('#blEmails').value = '';
          q('#blDomains').value = '';
          q('#loadBlocklist').click();
        } catch (err) { UI.toastError(err); }
      });
    };

    /* system actions */
    q('#validateBtn').onclick = (e) => UI.withSpinner(e.currentTarget, async () => {
      try {
        const r = await API.validateSystem();
        showValidation(r);
      } catch (err) { UI.toastError(err); }
    });

    view.querySelectorAll('[data-sys]').forEach((btn) => {
      btn.onclick = async () => {
        const action = btn.dataset.sys;
        const label  = btn.dataset.label;
        const confirmMsg = btn.dataset.confirm;

        if (confirmMsg && !(await UI.confirm({
          title: label, message: confirmMsg, confirmLabel: label,
        }))) return;

        UI.withSpinner(btn, async () => {
          const out = q('#sysOut');
          try {
            const res = await API.op(action);
            const line = res.message
              || (typeof res.succeeded === 'number' ? `${res.succeeded} succeeded, ${res.failed} failed.` : 'Done.');
            out.innerHTML = `<div class="alert alert-ok"><i class="fa-solid fa-circle-check"></i>
                             <div><strong>${UI.esc(label)}:</strong> ${UI.esc(line)}</div></div>`;
            UI.toast(line, 'success');
          } catch (err) {
            out.innerHTML = UI.errorBox(`${label}: ${err.message}`);
          }
        });
      };
    });
  }

  function showValidation(r) {
    UI.modal({
      title: 'System validation', size: 'large',
      render: (body) => {
        const block = (title, items, tone, icon) => !items.length ? '' : `
          <div class="card mt-16">
            <div class="card-head">
              <h3><i class="fa-solid ${icon}" style="color:var(--${tone})"></i> ${title} (${items.length})</h3>
            </div>
            <div class="card-body">
              <div class="kv-list">
                ${items.map((i) => `<div style="font-size:12.5px;line-height:1.6">${UI.esc(i)}</div>`).join('')}
              </div>
            </div>
          </div>`;

        body.innerHTML = `
          <div class="alert ${r.healthy ? 'alert-ok' : 'alert-error'}">
            <i class="fa-solid ${r.healthy ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i>
            <div>${UI.esc(r.summary || '')}</div>
          </div>

          <div class="grid grid-4">
            ${UI.statCard({ label: 'Passed', value: UI.num(r.passedCount), icon: 'fa-check', tone: 'green' })}
            ${UI.statCard({ label: 'Failed', value: UI.num(r.failedCount), icon: 'fa-xmark', tone: 'red' })}
            ${UI.statCard({ label: 'Warnings', value: UI.num(r.warningCount), icon: 'fa-triangle-exclamation', tone: 'orange' })}
            ${UI.statCard({ label: 'Healthy', value: r.healthy ? 'Yes' : 'No', icon: 'fa-heart-pulse',
                            tone: r.healthy ? 'green' : 'red' })}
          </div>

          ${block('Failed', r.failed || [], 'red', 'fa-circle-xmark')}
          ${block('Warnings', r.warnings || [], 'orange', 'fa-triangle-exclamation')}
          ${block('Passed', r.passed || [], 'green', 'fa-circle-check')}`;
      },
    });
  }

  return { render };
})();

/* ==========================================================================
   app.js — shell: session bootstrap, hash routing, sidebar, logout.
   ========================================================================== */

(() => {

  const TABS = {
    dashboard: { title: 'Dashboard',      render: Dashboard.render },
    accounts:  { title: 'Email Accounts', render: Accounts.render },
    campaigns: { title: 'Campaigns',      render: Campaigns.render },
    leads:     { title: 'Leads',          render: Leads.render },
    settings:  { title: 'Settings',       render: Settings.render },
  };

  const view = document.getElementById('view');
  let current = null;

  // Renders are serialised. Clicking three tabs quickly used to start three
  // overlapping renders that painted over each other as their requests landed;
  // now a click during a render is remembered and run once the current one
  // finishes, so only the tab you ended on is ever drawn.
  let rendering = false;
  let queued = null;

  const tabFromHash = () => {
    const name = (location.hash || '').replace(/^#\//, '').split('/')[0];
    return TABS[name] ? name : 'dashboard';
  };

  function setBusy(on) {
    document.body.classList.toggle('is-routing', on);
  }

  async function route() {
    if (rendering) {
      queued = tabFromHash();          // coalesce: only the latest wins
      return;
    }
    rendering = true;
    setBusy(true);
    try {
      await renderTab();
    } finally {
      rendering = false;
      setBusy(false);
      if (queued) { queued = null; route(); }
    }
  }

  async function renderTab() {
    const name = tabFromHash();
    current = name;

    document.getElementById('pageTitle').textContent = TABS[name].title;
    document.querySelectorAll('.sidebar-nav a').forEach((a) => {
      a.classList.toggle('active', a.dataset.tab === name);
    });

    // Charts hold canvas references across renders; drop them before swapping
    // views or Chart.js keeps the old instances alive.
    Charts.destroyAll();
    closeOverlays();
    document.body.classList.remove('nav-open');
    document.querySelector('.sidebar').classList.remove('open');

    try {
      await TABS[name].render(view);
    } catch (err) {
      view.innerHTML = UI.errorBox(err.message || 'Something went wrong rendering this page.');
    }
  }

  function closeOverlays() {
    document.getElementById('modalHost').innerHTML = '';
    document.getElementById('drawerHost').innerHTML = '';
  }

  const bootMsg = (text) => {
    const el = document.getElementById('bootMsg');
    if (el) el.textContent = text;
  };

  function dismissSplash() {
    const el = document.getElementById('bootSplash');
    if (!el) return;
    el.classList.add('done');
    // Remove after the fade so it can never swallow a click.
    setTimeout(() => el.remove(), 260);
  }

  async function boot() {
    let user;
    try {
      user = await API.me();
    } catch {
      user = null;
    }

    if (!user) {
      window.location.href = '/';
      return;
    }

    document.getElementById('userEmail').textContent = user.email;
    document.getElementById('userAvatar').textContent = UI.initials(user.name || user.email);
    document.getElementById('masterBadge').querySelector('span').textContent =
      `Backend ${user.masterId}`;

    document.getElementById('logoutBtn').onclick = (e) =>
      UI.withSpinner(e.currentTarget, () => API.logout());

    // The only thing that forces a cold read of every endpoint. Tab switches
    // reuse the cache so navigating around does not re-hit Apps Script.
    document.getElementById('refreshBtn').onclick = (e) =>
      UI.withSpinner(e.currentTarget, async () => {
        API.invalidate();
        await route();
      });

    const sidebar = document.querySelector('.sidebar');
    document.getElementById('menuToggle').onclick = () => {
      sidebar.classList.toggle('open');
      document.body.classList.toggle('nav-open');
    };
    document.getElementById('sidebarScrim').onclick = () => {
      sidebar.classList.remove('open');
      document.body.classList.remove('nav-open');
    };

    window.addEventListener('hashchange', route);
    if (!location.hash) location.hash = '#/dashboard';

    bootMsg('Loading your workspace…');
    try {
      await route();
    } finally {
      dismissSplash();          // never leave the splash up on a failed tab
    }
  }

  boot().catch(() => {
    bootMsg('Could not start. Refresh to try again.');
    setTimeout(dismissSplash, 1500);
  });
})();

</script>
</body>
